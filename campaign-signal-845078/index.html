<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Campaign Signal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#fbfbf9; --surface:#ffffff; --surface-2:#f2f4f1; --surface-3:#e9ede9;
  --line:#e0e5df; --line-strong:#c8d0c7;
  --ink:#111a17; --ink-2:#4a554f; --ink-3:#77827b;
  --accent:#0f6b4f; --accent-soft:#e3f0ea;
  --s1:#1baf7a; --s2:#2a78d6; --s3:#eb6834;
  --good:#1baf7a; --warn:#eda100; --bad:#e34948;
  --shadow:0 1px 2px rgba(17,26,23,.06), 0 8px 24px -12px rgba(17,26,23,.18);
  --r:10px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#101311; --surface:#171b19; --surface-2:#1d221f; --surface-3:#262c28;
    --line:#2b322d; --line-strong:#3b433d;
    --ink:#eef2ef; --ink-2:#a9b4ad; --ink-3:#7d8882;
    --accent:#3fbf90; --accent-soft:#16291f;
    --s1:#199e70; --s2:#3987e5; --s3:#d95926;
    --good:#199e70; --warn:#c98500; --bad:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#101311; --surface:#171b19; --surface-2:#1d221f; --surface-3:#262c28;
  --line:#2b322d; --line-strong:#3b433d;
  --ink:#eef2ef; --ink-2:#a9b4ad; --ink-3:#7d8882;
  --accent:#3fbf90; --accent-soft:#16291f;
  --s1:#199e70; --s2:#3987e5; --s3:#d95926;
  --good:#199e70; --warn:#c98500; --bad:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- chrome ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
.tab{border:0;background:transparent;color:var(--ink-2);padding:6px 13px;border-radius:7px;
  font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.wrap{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:22px 64px}

/* ---------- leadership ---------- */
.lead-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.lead-head h1{font-size:clamp(22px,3.4vw,32px);font-weight:700}
.period{font-size:12px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.02em}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;
  padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 15px;
  position:relative;overflow:hidden}
.kpi .cap{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.kpi .fig{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,38px);line-height:1.08;
  margin-top:8px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink-2);margin-top:5px}
.kpi.hero{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%);border-color:var(--line-strong)}
.kpi.hero .fig{color:var(--accent)}
.spark{display:block;margin-top:10px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px}
.card.wide{grid-column:1/-1}
.card h3{font-size:14px;font-weight:600;letter-spacing:-.01em}
.card .note{font-size:12px;color:var(--ink-3);margin:3px 0 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 6px;padding:0;list-style:none;font-size:12px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;flex:none}
.swatch.line{height:3px;border-radius:2px;width:15px}

svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;
  background:var(--surface-2);position:sticky;top:0;z-index:2}
tbody tr:hover{background:var(--surface-2)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;
  font-family:var(--mono)}
.pill.up{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.flat{background:var(--surface-3);color:var(--ink-3)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* ---------- editor ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:17px;font-weight:600;margin-right:auto}
select,input[type=text],input[type=number],input[type=date]{background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;font-size:13px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 13px;
  font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--ink-3);padding:5px 8px}
.btn.ghost:hover{color:var(--bad);background:var(--surface-2)}
.grid-tbl input,.grid-tbl select{border:1px solid transparent;background:transparent;border-radius:5px;
  padding:4px 6px;width:100%;min-width:64px}
.grid-tbl input:hover,.grid-tbl select:hover{border-color:var(--line)}
.grid-tbl input:focus,.grid-tbl select:focus{border-color:var(--accent);background:var(--surface)}
.grid-tbl td{padding:3px 5px}
.grid-tbl td.calc{color:var(--ink-2);font-family:var(--mono);font-variant-numeric:tabular-nums;padding:6px 10px;
  background:var(--surface-2)}
.grid-tbl input.name{min-width:190px}
.grid-tbl input.num{text-align:right}
.status{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.drop{border:2px dashed var(--line-strong);border-radius:var(--r);padding:34px 20px;text-align:center;
  background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-family:var(--display);font-size:16px;margin-bottom:4px}
.drop span{font-size:13px;color:var(--ink-2)}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;padding:5px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.field label{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.06em}
.field input{width:100%}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.cols{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:0 0 14px;line-height:1.75}
code{font-family:var(--mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:4px}

/* numbered steps on the import page */
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px}
.stepno{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;
  font-size:14px;margin-top:1px}
.stepbody{flex:1;min-width:0}
.stepbody h3{font-size:16px;font-weight:600;margin-bottom:3px}
.stepbody .note{margin:0 0 12px}
.stepbody .note input[type=number]{width:62px;padding:2px 6px;font-size:12px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow input{flex:1;min-width:240px}
.msg{font-size:13px;margin:12px 0 0;padding:9px 12px;border-radius:9px;background:var(--surface-2);
  color:var(--ink-2);border:1px solid var(--line)}
.msg.ok{background:color-mix(in srgb,var(--good) 10%,var(--surface));
  border-color:color-mix(in srgb,var(--good) 32%,var(--line));color:var(--ink)}
.msg.bad{background:color-mix(in srgb,var(--bad) 9%,var(--surface));
  border-color:color-mix(in srgb,var(--bad) 32%,var(--line));color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tagx{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:99px;padding:3px 10px;color:var(--ink-2)}
.tagx.miss{color:var(--ink-3);border-style:dashed}
table.mini{font-size:12px;margin-top:10px}
table.mini th,table.mini td{padding:6px 9px}
.btn.off{opacity:.45;cursor:not-allowed}

/* polish */
.top{backdrop-filter:saturate(1.4) blur(8px);background:color-mix(in srgb,var(--surface) 88%,transparent)}
.tab,.chip,.btn,.kpi,.card,.drop{transition:background .14s ease,border-color .14s ease,
  color .14s ease,box-shadow .14s ease,transform .14s ease}
.kpi:hover{box-shadow:var(--shadow)}
.drop{border-radius:12px}
.drop:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface-2))}
.card{border-radius:14px}
.btn{border-radius:9px}
.btn.primary:active{transform:translateY(1px)}
svg.chart .bar{transition:opacity .12s ease}
svg.chart:hover .bar{opacity:.72}
svg.chart .bar:hover{opacity:1}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--ground);
  padding:7px 10px;border-radius:7px;font-size:12px;font-family:var(--mono);opacity:0;transition:opacity .1s;
  box-shadow:var(--shadow);max-width:250px}
.tip.on{opacity:1}
.empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .top-in{padding:10px 16px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===================== leadership, rebuilt ===================== */
.lead2{display:flex;flex-direction:column;gap:16px}
.l2head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.l2head h1{font-size:clamp(23px,3.6vw,34px);font-weight:700;letter-spacing:-.025em}
.l2head .period{margin:5px 0 0}

/* the period filter, used on the page and inside every window */
.rangebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:9px 11px;box-shadow:var(--shadow)}
.rb-lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700}
.seg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:11px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:8px;
  font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .15s ease,color .15s ease,box-shadow .15s ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(17,26,23,.1)}
.custom{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--ink-3)}
.custom input{padding:5px 8px;font-size:12.5px}

/* the one number that opens the page */
.hero{position:relative;display:grid;grid-template-columns:minmax(250px,.9fr) 1.35fr;gap:30px;
  align-items:center;text-align:left;cursor:pointer;border:1px solid var(--line-strong);
  border-radius:22px;padding:26px 28px;overflow:hidden;
  background:radial-gradient(130% 150% at 2% 0%,color-mix(in srgb,var(--accent) 17%,transparent),
    transparent 58%),var(--surface);
  box-shadow:0 1px 2px rgba(17,26,23,.05),0 28px 54px -34px rgba(17,26,23,.42);
  transition:transform .2s cubic-bezier(.2,.8,.25,1),box-shadow .2s ease,border-color .2s ease}
.hero:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line-strong));
  box-shadow:0 1px 2px rgba(17,26,23,.05),0 34px 64px -34px rgba(17,26,23,.5)}
.hero .cap{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--ink-3);font-weight:700}
.hero .fig{font-family:var(--display);font-weight:700;font-size:clamp(46px,8.4vw,88px);line-height:.92;
  letter-spacing:-.05em;color:var(--accent);margin:12px 0 0;font-variant-numeric:tabular-nums}
.hero-sub{font-size:14.5px;color:var(--ink-2);margin:10px 0 12px;max-width:30ch}
.hero .go{display:block;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--accent);
  opacity:.72;transition:opacity .16s ease,transform .16s ease}
.hero:hover .go{opacity:1;transform:translateX(3px)}
.hero-r{min-width:0}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero-pills span{display:flex;flex-direction:column;gap:1px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:11px;padding:8px 13px;font-size:11px;color:var(--ink-3)}
.hero-pills b{font-family:var(--display);font-size:16px;color:var(--ink);letter-spacing:-.02em}

/* movement against the period before */
.delta{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;
  font-weight:600;border-radius:99px;padding:4px 10px;background:var(--surface-2);color:var(--ink-3)}
.delta i{font-style:normal;font-weight:400;opacity:.8;font-family:var(--sans)}
.delta.up{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.delta.down{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.delta.none{font-family:var(--sans);font-weight:400}

/* the sliding rail of windows */
.railhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 -2px}
.railhead h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.railhead .hint{margin:0;flex:1 1 220px}
.railnavs{display:flex;gap:6px;margin-left:auto;flex:none}
.rail-wrap{position:relative;margin-inline:-4px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 4px 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 clamp(226px,23vw,264px);scroll-snap-align:start;display:flex;flex-direction:column;
  text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);
  border-radius:17px;padding:15px 16px 12px;
  box-shadow:0 1px 2px rgba(17,26,23,.04),0 16px 32px -26px rgba(17,26,23,.45);
  transition:transform .2s cubic-bezier(.2,.8,.25,1),box-shadow .2s ease,border-color .2s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--line-strong);
  box-shadow:0 1px 2px rgba(17,26,23,.05),0 22px 40px -24px rgba(17,26,23,.5)}
.tile::before{content:"";display:block;width:26px;height:3px;border-radius:99px;background:var(--c);
  margin-bottom:11px;opacity:.9}
.tile .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.tile .fig{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,30px);line-height:1.1;
  letter-spacing:-.03em;margin-top:7px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:11.5px;color:var(--ink-3);margin-top:4px;min-height:32px;line-height:1.4}
.tile .nospark{display:block;height:34px;margin-top:10px}
.tile .go{font-size:11px;font-weight:600;color:var(--accent);margin-top:9px;opacity:0;
  transition:opacity .16s ease,transform .16s ease}
.tile:hover .go,.tile:focus-visible .go{opacity:1;transform:translateX(2px)}
.railnav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;color:var(--ink-2);box-shadow:var(--shadow);
  transition:transform .15s ease,color .15s ease,background .15s ease}
.railnav:hover{color:var(--ink);background:var(--surface-2);transform:scale(1.07)}
.progress{height:3px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:-6px 2px 4px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;opacity:.75}
.foot{font-size:12px;color:var(--ink-3);line-height:1.65;max-width:95ch;margin:8px 0 0}

/* the window that opens */
body.locked{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 46%,transparent);
  backdrop-filter:blur(4px);opacity:0;transition:opacity .24s ease}
.sheet-card{position:relative;width:min(1120px,100%);max-height:94vh;display:flex;flex-direction:column;
  background:var(--ground);border:1px solid var(--line-strong);border-bottom:0;
  border-radius:24px 24px 0 0;overflow:hidden;opacity:0;transform:translateY(26px) scale(.995);
  box-shadow:0 -14px 70px -24px rgba(0,0,0,.5);
  transition:transform .3s cubic-bezier(.2,.86,.26,1),opacity .22s ease}
.sheet.on .sheet-bg{opacity:1}
.sheet.on .sheet-card{opacity:1;transform:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px 22px 15px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px)}
.sheet-head .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);
  font-weight:700}
.sheet-head h2{font-family:var(--display);font-size:clamp(24px,4vw,34px);font-weight:700;
  letter-spacing:-.035em;margin:4px 0 0;font-variant-numeric:tabular-nums}
.sheet-head h2 small{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-3);
  letter-spacing:0;margin-left:7px}
.sheet-head .sub{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.hx{display:flex;gap:6px;flex:none}
.icb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;display:flex;align-items:center;
  justify-content:center;transition:background .14s ease,color .14s ease}
.icb:hover{background:var(--surface-2);color:var(--ink)}
.icb.close{font-size:13px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:16px 22px 30px;
  display:flex;flex-direction:column;gap:14px}
.sheet-body .grid{margin:0;grid-template-columns:1fr}
.sheet-body svg.chart{max-width:900px;margin-inline:auto}
.sheet-body svg.chart.trend{max-width:none}
.sheet-body .scroll{max-height:62vh;overflow:auto}
.sheet-body .card{padding:17px 19px 14px}
.blurb{font-size:13.5px;color:var(--ink-2);line-height:1.62;margin:0;max-width:92ch}
.blurb .status{display:block;margin-top:3px}
.bigrow{display:grid;grid-template-columns:minmax(170px,.55fr) 1.45fr;gap:24px;align-items:center}
.bigrow .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);
  font-weight:700;display:block}
.bigfig{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.6vw,52px);line-height:1;
  letter-spacing:-.04em;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.bigtrend{min-width:0}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:16px}
.mini>div{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini b{overflow:hidden;text-overflow:ellipsis}
.mini span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.mini b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
tr.tot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-strong)}

/* appearance switch */
#thm{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:99px;padding:5px 12px 5px 10px;font-size:12px;font-weight:600;color:var(--ink-2);
  cursor:pointer;line-height:1.4}
#thm:hover{color:var(--ink);border-color:var(--line-strong)}
#thm span{font-weight:500}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:18px;padding:22px 20px}
  .bigrow{grid-template-columns:1fr;gap:14px}
  .sheet-card{max-height:96vh;border-radius:20px 20px 0 0}
  .sheet-body{padding:14px 15px 26px}
  .sheet-head{padding:15px 16px 13px}
}
@media (max-width:760px){
  .tabs{flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .brand{flex:1 0 100%;margin-right:0}
  .top-in{gap:10px}
}
@media (max-width:640px){
  .railnavs{display:none}
  .tile{flex:0 0 min(78vw,264px)}
  #thm span{display:none}
  #thm{padding:5px 9px}
  .rangebar{padding:8px 9px}
  .seg button{padding:6px 10px;font-size:12px}
}
</style>

<script>
(function(){
"use strict";
/* ============================ state ============================ */
var DEF={marketingRate:.9385,utilityRate:.13,gstRate:.18,platformFee:20000,metaCPC:15,googleCPC:50,
  windowDays:30};
var S={cfg:Object.assign({},DEF),months:{},inv:{},orders:[],aud:[],match:null,ready:false,db:null,note:""};
var FIELDS=["date","campaign","cohort","goal","category","number","targeted","sent","delivered","read","clicks","unique","conversions","revenue"];
var NUMF=["targeted","sent","delivered","read","clicks","unique","conversions","revenue"];
var STANDALONE=!(window.claude&&window.claude.use);

function mk(d){return (d||"").slice(0,7);}
function n(v){return typeof v==="number"&&isFinite(v)?v:null;}
function num(v){var x=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isFinite(x)?x:null;}
function rate(cat){var c=(cat||"").trim().toLowerCase();
  return c==="marketing"?S.cfg.marketingRate:(c==="utility"?S.cfg.utilityRate:0);}
function cost(r){var d=n(r.delivered);return d===null?null:Math.round(d*rate(r.category)*100)/100;}

function inr(v,dp){if(v===null||v===undefined||!isFinite(v))return"—";
  var neg=v<0;v=Math.abs(v);var s=(dp?v.toFixed(dp):Math.round(v).toString());
  var p=s.split("."),i=p[0],last3=i.slice(-3),rest=i.slice(0,-3);
  if(rest)last3=rest.replace(/\B(?=(\d{2})+(?!\d))/g,",")+","+last3;
  return (neg?"-₹":"₹")+last3+(p[1]?"."+p[1]:"");}
function cr(v){if(v===null||!isFinite(v))return"—";
  if(Math.abs(v)>=1e7)return"₹"+(v/1e7).toFixed(2)+" Cr";
  if(Math.abs(v)>=1e5)return"₹"+(v/1e5).toFixed(2)+" L";
  return inr(v);}
function pc(v,dp){return v===null||!isFinite(v)?"—":(v*100).toFixed(dp===undefined?1:dp)+"%";}
function cnt(v){return v===null||!isFinite(v)?"—":Math.round(v).toLocaleString("en-IN");}
function mlabel(m){if(!m)return"";var p=m.split("-");
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+p[0];}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ============================ derive ============================ */
function allRows(){var out=[];Object.keys(S.months).sort().forEach(function(m){
  (S.months[m].rows||[]).forEach(function(r){out.push(r);});});return out;}

function campaigns(rows){                      // group cohort rows into campaigns
  var map={},order=[];
  rows.forEach(function(r){
    var k=(r.campaign||"(unnamed)").trim()+"|"+mk(r.date);
    if(!map[k]){map[k]={key:k,name:(r.campaign||"(unnamed)").trim(),month:mk(r.date),date:r.date,
      spend:0,targeted:0,sent:0,delivered:0,read:0,clicks:0,unique:0,mktSpend:0,
      conversions:null,revenue:null,goal:r.goal||"",cohorts:0};order.push(map[k]);}
    var g=map[k],c=cost(r);
    g.cohorts++;
    if(c!==null){g.spend+=c;if((r.category||"").trim().toLowerCase()==="marketing")g.mktSpend+=c;}
    NUMF.forEach(function(f){if(f==="conversions"||f==="revenue")return;
      var v=n(r[f]);if(v!==null)g[f]=(g[f]||0)+v;});
    var cv=n(r.conversions),rv=n(r.revenue);
    if(cv!==null)g.conversions=(g.conversions||0)+cv;
    if(rv!==null)g.revenue=(g.revenue||0)+rv;
  });
  order.forEach(function(g){
    g.cpc=g.clicks>0?g.mktSpend/g.clicks:null;
    g.convRate=(g.conversions!==null&&g.clicks>0)?g.conversions/g.clicks:null;
    g.roi=(g.revenue!==null&&g.spend>0)?g.revenue/g.spend:null;
  });
  return order;
}
function months(){
  var rows=allRows(),by={};
  rows.forEach(function(r){
    var m=mk(r.date);if(!m)return;
    if(!by[m])by[m]={month:m,spend:0,mktSpend:0,delivered:0,sent:0,targeted:0,read:0,clicks:0,unique:0,
      conversions:0,revenue:0,campaigns:0};
    var o=by[m],c=cost(r);
    if(c!==null){o.spend+=c;if((r.category||"").trim().toLowerCase()==="marketing")o.mktSpend+=c;}
    ["targeted","sent","delivered","read","clicks","unique","conversions","revenue"].forEach(function(f){
      var v=n(r[f]);if(v!==null)o[f]+=v;});
  });
  campaigns(rows).forEach(function(g){if(by[g.month])by[g.month].campaigns++;});
  return Object.keys(by).sort().map(function(m){
    var o=by[m], iv=S.inv[m]||{};
    var fee=n(iv.platformFee);if(fee===null)fee=S.cfg.platformFee;
    o.fee=fee;                                    /* Gupshup platform fee for the month */
    o.gst=(o.spend+fee)*S.cfg.gstRate;
    o.bill=o.spend+fee+o.gst;                     /* what the month really costs us */
    o.cpc=o.clicks>0?o.mktSpend/o.clicks:null;    /* media spend only, the usual CPC convention */
    o.roi=o.bill>0?o.revenue/o.bill:null;         /* ROI is measured against the full bill */
    o.deliveryRate=o.sent>0?o.delivered/o.sent:null;
    o.readRate=o.delivered>0?o.read/o.delivered:null;
    o.clickRate=o.read>0?o.clicks/o.read:null;
    o.costPerConv=o.conversions>0?o.bill/o.conversions:null;
    return o;});
}
function totals(ms){
  var t={spend:0,revenue:0,conversions:0,campaigns:0,clicks:0,mktSpend:0,delivered:0,read:0,sent:0,fee:0};
  ms.forEach(function(m){["spend","revenue","conversions","campaigns","clicks","mktSpend","delivered","read","sent","fee"]
    .forEach(function(f){t[f]+=m[f]||0;});});
  t.gst=(t.spend+t.fee)*S.cfg.gstRate;
  t.bill=t.spend+t.fee+t.gst;
  t.roi=t.bill>0?t.revenue/t.bill:null;
  t.cpc=t.clicks>0?t.mktSpend/t.clicks:null;
  t.costPerConv=t.conversions>0?t.bill/t.conversions:null;
  t.readRate=t.delivered>0?t.read/t.delivered:null;
  t.months=ms.length;
  return t;
}

/* ================= matching people to purchases ================= */
/* A contact is reduced to a key we can compare: a 10 digit phone, or a lowercased email. */
function keyOf(v){
  var s=String(v==null?"":v).trim();
  if(!s)return "";
  if(s.indexOf("@")>0)return s.toLowerCase();
  var d=s.replace(/\D/g,"");
  return d.length>=10?d.slice(-10):"";
}
function keysFrom(vals){
  var out=[];
  vals.forEach(function(v){var k=keyOf(v);if(k&&out.indexOf(k)<0)out.push(k);});
  return out;
}
function dnum(iso){                                   /* days since epoch, for window maths */
  var p=String(iso||"").slice(0,10).split("-");
  if(p.length!==3)return null;
  var t=Date.UTC(+p[0],+p[1]-1,+p[2]);
  return isFinite(t)?Math.round(t/86400000):null;
}
function orderIndex(){
  var ix={};
  S.orders.forEach(function(o,i){
    (o.k||[]).forEach(function(k){(ix[k]=ix[k]||[]).push(i);});
  });
  return ix;
}
/* One entry per campaign-month: when it went out, what it sold, which coupon proves it. */
function matchTargets(){
  var out={};
  allRows().forEach(function(r){
    var name=(r.campaign||"").trim();if(!name)return;
    var m=mk(r.date),k=name.toLowerCase()+"|"+m;
    if(!out[k])out[k]={key:k,name:name,month:m,send:r.date,keyword:"",coupon:""};
    var o=out[k];
    if(r.date&&(!o.send||r.date<o.send))o.send=r.date;
    if(!o.keyword&&r.keyword)o.keyword=String(r.keyword).trim();
    if(!o.coupon&&r.coupon)o.coupon=String(r.coupon).trim();
  });
  return Object.keys(out).map(function(k){return out[k];})
    .sort(function(a,b){return (a.send||"")<(b.send||"")?-1:1;});
}
function runMatch(){
  var ix=orderIndex(), win=n(S.cfg.windowDays)||30, used={}, detail=[], per={};
  var audBy={};
  S.aud.forEach(function(a){
    var k=(a.campaign||"").trim().toLowerCase();
    (audBy[k]=audBy[k]||[]).push(a.k);
  });
  matchTargets().forEach(function(t){
    var list=audBy[t.name.toLowerCase()];
    per[t.key]={name:t.name,month:t.month,conversions:0,revenue:0,audience:list?list.length:0,
      rule:t.coupon?"Coupon "+t.coupon:(t.keyword?"Product: "+t.keyword:"Any product"),
      measurable:!!list};
    if(!list||!list.length)return;
    var sd=dnum(t.send), kw=(t.keyword||"").toLowerCase(), cp=(t.coupon||"").trim();
    var seen={};
    list.forEach(function(k){
      if(seen[k])return;seen[k]=1;
      var cands=ix[k]||[], best=null;
      cands.forEach(function(i){
        if(used[i])return;
        var o=S.orders[i];
        if(cp){ if(String(o.coupon||"").trim()!==cp)return; }
        else{
          var od=dnum(o.date);
          if(od===null||sd===null||od<sd||od-sd>win)return;
          if(kw&&String(o.product||"").toLowerCase().indexOf(kw)<0)return;
        }
        if(best===null||String(S.orders[i].date)<String(S.orders[best].date))best=i;
      });
      if(best===null)return;
      used[best]=1;
      var o=S.orders[best];
      per[t.key].conversions++;per[t.key].revenue+=(+o.amount||0);
      detail.push({campaign:t.name,month:t.month,contact:k,send:t.send,date:o.date,
        product:o.product,amount:+o.amount||0,coupon:o.coupon||"",rule:per[t.key].rule});
    });
  });
  S.match={when:new Date().toISOString().slice(0,16).replace("T"," "),per:per,detail:detail,
    orders:S.orders.length,audience:S.aud.length};
  return S.match;
}
function applyMatch(){
  if(!S.match)return 0;
  var touched={},done=0;
  Object.keys(S.match.per).forEach(function(k){
    var p=S.match.per[k];
    if(!p.measurable)return;
    var mo=S.months[p.month];if(!mo)return;
    var hit=null;
    (mo.rows||[]).forEach(function(r){
      if(!hit&&(r.campaign||"").trim().toLowerCase()===p.name.toLowerCase())hit=r;});
    if(!hit)return;
    hit.conversions=p.conversions;hit.revenue=p.revenue;
    touched[p.month]=1;done++;
  });
  Object.keys(touched).forEach(save);
  return done;
}

/* ---------- what Gupshup should bill us, and what it did ---------- */
function invFor(m){
  return S.inv[m]||{month:m,invoiceNo:"",source:"Not received",marketingMsgs:null,utilityMsgs:null,
    platformFee:S.cfg.platformFee,taxable:null,gst:null,total:null,notes:""};
}
function billing(mo){
  var iv=invFor(mo.month);
  var ours=mo.bill, gst=mo.gst, fee=mo.fee;
  var billed=n(iv.total);
  return {month:mo.month,msgSpend:mo.spend,fee:fee,gst:gst,ours:ours,
    billed:billed,source:iv.source||"Not received",invoiceNo:iv.invoiceNo||"",
    gap:billed===null?null:ours-billed,

  var top=niceMax(mx*1.18)||1;

/* ====================== leadership: dates ====================== */
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dstr(t){var d=new Date(t);return d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)
  +"-"+("0"+d.getUTCDate()).slice(-2);}
function dayt(iso){var p=String(iso||"").slice(0,10).split("-");
  if(p.length!==3)return null;var t=Date.UTC(+p[0],+p[1]-1,+p[2]);return isFinite(t)?t:null;}
function addDays(iso,k){var t=dayt(iso);return t===null?iso:dstr(t+k*86400000);}
function spanDays(a,b){var x=dayt(a),y=dayt(b);
  return (x===null||y===null)?0:Math.round((y-x)/86400000)+1;}
function monthStart(m){return m+"-01";}
function monthEnd(m){var p=String(m).split("-");return dstr(Date.UTC(+p[0],+p[1],1)-86400000);}
function dim(m){return +monthEnd(m).slice(8,10);}
function dshort(iso){return +iso.slice(8,10)+" "+MON[+iso.slice(5,7)-1];}
function dlong(iso){return +iso.slice(8,10)+" "+MON[+iso.slice(5,7)-1]+" "+iso.slice(0,4);}
function dataMonths(){var s={};allRows().forEach(function(r){var m=mk(r.date);if(m)s[m]=1;});
  return Object.keys(s).sort();}
var MINFO=null;
function monthInfo(){
  if(MINFO)return MINFO;
  var o={};
  allRows().forEach(function(r){
    var m=mk(r.date),d=String(r.date||"").slice(0,10);
    if(!m||d.length!==10)return;
    var e=o[m]||(o[m]={d1:d,d2:d,delivered:0});
    if(d<e.d1)e.d1=d;if(d>e.d2)e.d2=d;
    var v=n(r.delivered);if(v!==null)e.delivered+=v;
  });
  MINFO=o;return o;
}
function dataSpan(){var lo=null,hi=null;
  allRows().forEach(function(r){var d=String(r.date||"").slice(0,10);
    if(d.length!==10)return;if(lo===null||d<lo)lo=d;if(hi===null||d>hi)hi=d;});
  return {lo:lo,hi:hi};}

/* ====================== leadership: period ====================== */
var RANGES=[{k:"all",label:"All time"},{k:"y",label:"1 year",days:365},
  {k:"h",label:"6 months",days:182},{k:"q",label:"Quarter",days:91},
  {k:"m",label:"30 days",days:30},{k:"w",label:"7 days",days:7},{k:"d",label:"Last day",days:1}];
var RG={k:"all",month:"",from:"",to:""};
function rangeDays(k){for(var i=0;i<RANGES.length;i++)if(RANGES[i].k===k)return RANGES[i].days||0;return 0;}
function resolve(rg){
  var sp=dataSpan();
  if(!sp.hi)return {from:"9999-01-01",to:"9999-12-31",label:"No data",note:""};
  if(rg.k==="all")return {from:sp.lo,to:sp.hi,label:"All time",
    note:dlong(sp.lo)+" to "+dlong(sp.hi)};
  if(rg.k==="month"){
    var m=rg.month||mk(sp.hi);
    return {from:monthStart(m),to:monthEnd(m),label:mlabel(m),note:"The whole of "+mlabel(m)};}
  if(rg.k==="custom"){
    var f=rg.from||sp.lo,t=rg.to||sp.hi;
    if(f>t){var x=f;f=t;t=x;}
    return {from:f,to:t,label:dshort(f)+" to "+dshort(t),
      note:spanDays(f,t)+" days, "+dlong(f)+" to "+dlong(t)};}
  var d=rangeDays(rg.k)||1, from=addDays(sp.hi,-(d-1));
  if(from<sp.lo)from=sp.lo;
  var lab=RANGES.filter(function(r){return r.k===rg.k;})[0];
  return {from:from,to:sp.hi,label:lab?lab.label:"All time",
    note:(d===1?"":"The "+d+" days to ")+dlong(sp.hi)};
}

/* ====================== leadership: aggregate ====================== */
var SUMF=["targeted","sent","delivered","read","clicks","unique","conversions","revenue"];
function agg(from,to,skipBill){
  var rows=allRows().filter(function(r){var d=String(r.date||"").slice(0,10);
    return d.length===10&&d>=from&&d<=to;});
  var o={from:from,to:to,nrows:rows.length,spend:0,mktSpend:0,utilSpend:0,mktMsgs:0,utilMsgs:0,byMonth:{}};
  SUMF.forEach(function(f){o[f]=0;});
  rows.forEach(function(r){
    var c=cost(r),cat=(r.category||"").trim().toLowerCase(),d=n(r.delivered);
    if(d!==null){var mm=mk(r.date);o.byMonth[mm]=(o.byMonth[mm]||0)+d;}
    if(c!==null){o.spend+=c;
      if(cat==="marketing")o.mktSpend+=c;else if(cat==="utility")o.utilSpend+=c;}
    if(d!==null){if(cat==="marketing")o.mktMsgs+=d;else if(cat==="utility")o.utilMsgs+=d;}
    SUMF.forEach(function(f){var v=n(r[f]);if(v!==null)o[f]+=v;});
  });
  o.camps=campaigns(rows);
  o.campaigns=o.camps.length;
  var fee=0,MI=monthInfo();
  dataMonths().forEach(function(m){
    var ms=monthStart(m),me=monthEnd(m),e=MI[m]||{d1:ms,d2:me,delivered:0};
    if(me<from||ms>to)return;
    var f=n((S.inv[m]||{}).platformFee);if(f===null)f=S.cfg.platformFee;
    /* the fee is charged by the month, so a window that holds the whole month's
       sending carries the whole fee. A window that cuts a month pays its share. */
    if(from<=e.d1&&to>=e.d2){fee+=f;return;}
    var share;
    if(e.delivered>0)share=(o.byMonth[m]||0)/e.delivered;
    else{var a=ms>from?ms:from,b=me<to?me:to;share=spanDays(a,b)/dim(m);}
    fee+=f*Math.max(0,Math.min(1,share));
  });
  o.fee=fee;
  o.gst=(o.spend+o.fee)*S.cfg.gstRate;
  o.bill=o.spend+o.fee+o.gst;
  o.feeGst=o.fee+o.gst;
  o.roi=o.bill>0?o.revenue/o.bill:null;
  o.cpc=o.clicks>0?o.mktSpend/o.clicks:null;
  o.costPerConv=o.conversions>0?o.bill/o.conversions:null;
  o.aov=o.conversions>0?o.revenue/o.conversions:null;
  o.deliveryRate=o.sent>0?o.delivered/o.sent:null;
  o.readRate=o.delivered>0?o.read/o.delivered:null;
  o.clickRate=o.read>0?o.clicks/o.read:null;
  o.convRate=o.clicks>0?o.conversions/o.clicks:null;
  o.costPerMsg=o.delivered>0?o.bill/o.delivered:null;
  /* what Gupshup billed for the months that sit wholly inside the period */
  var billed=null,oursB=0,nb=0;
  if(!skipBill)dataMonths().forEach(function(m){
    if(monthStart(m)<from||monthEnd(m)>to)return;
    var t=n((S.inv[m]||{}).total);if(t===null)return;
    billed=(billed||0)+t;nb++;
    oursB+=agg(monthStart(m),monthEnd(m),true).bill;
  });
  o.billed=billed;o.oursBilled=oursB;o.nBilled=nb;
  o.gap=billed===null?null:oursB-billed;
  o.gapPc=(billed===null||billed===0)?null:(oursB-billed)/billed;
  return o;
}
var AGGCACHE={};
function resetCache(){AGGCACHE={};MINFO=null;}
function aggc(from,to){
  if(!from||!to)return agg("9999-01-01","9999-12-31");
  var k=from+"~"+to;
  if(!AGGCACHE[k])AGGCACHE[k]=agg(from,to);
  return AGGCACHE[k];
}
function buckets(from,to){
  monthInfo();
  var sp=spanDays(from,to),out=[],d,s,e;
  if(sp<=1)return [{label:dshort(from),from:from,to:from,a:aggc(from,from)}];
  if(sp<=18){
    for(d=from;d<=to;d=addDays(d,1))out.push({label:dshort(d),from:d,to:d});
  }else if(sp<=56){
    s=from;
    while(s<=to){e=addDays(s,6);if(e>to)e=to;
      out.push({label:dshort(s),from:s,to:e});s=addDays(e,1);}
  }else{
    dataMonths().forEach(function(m){
      var ms=monthStart(m),me=monthEnd(m);
      if(me<from||ms>to)return;
      out.push({label:mlabel(m),month:m,from:ms>from?ms:from,to:me<to?me:to});
    });
  }
  out.forEach(function(b){b.a=aggc(b.from,b.to);});
  return out.filter(function(b){return b.a.nrows>0;});
}
function prevOf(from,to){
  var sp=spanDays(from,to)||1,sd=dataSpan();
  var pt=addDays(from,-1),pf=addDays(pt,-(sp-1));
  if(!sd.lo||pt<sd.lo)return null;
  if(pf<sd.lo)pf=sd.lo;
  var a=aggc(pf,pt);
  return a.nrows>0?a:null;
}

function bkTable(bks,set,total,title,note){
  var cols=COLSETS[set]||COLSETS.roi;
  var h=['<div class="card"><h3>'+esc(title)+'</h3><p class="note">'+esc(note)+'</p>'
    +'<div class="scroll"><table><thead><tr><th>Period</th>'];
  cols.forEach(function(c){h.push('<th>'+c[0]+'</th>');});
  h.push('</tr></thead><tbody>');
  bks.forEach(function(b){
    h.push('<tr><td>'+esc(b.label)+'</td>');
    cols.forEach(function(c){h.push('<td class="n">'+c[1](b.a)+'</td>');});
    h.push('</tr>');
  });
  h.push('<tr class="tot"><td>Whole period</td>');
  cols.forEach(function(c){h.push('<td class="n">'+c[1](total)+'</td>');});
  h.push('</tr></tbody></table></div></div>');
  return h.join("");
}
function campTable(a,by){
  var cs=a.camps.filter(function(c){return c.revenue||c.conversions||c.spend;});
  if(!cs.length)return "";
  cs.sort(function(x,y){
    if(by==="roi")return (y.revenue||0)/Math.max(y.spend,1)-(x.revenue||0)/Math.max(x.spend,1);
    if(by==="conversions")return (y.conversions||0)-(x.conversions||0);
    return (y.revenue||0)-(x.revenue||0);});
  var h=['<div class="card"><h3>Campaign by campaign</h3>'
   +'<p class="note">Every campaign inside the period. ROI here is measured on message cost alone, '
   +'because the platform fee and GST belong to the month and not to any one send.</p>'
   +'<div class="scroll"><table><thead><tr><th>Campaign</th><th>Sent</th><th>Message cost</th>'
   +'<th>Clicks</th><th>Conversions</th><th>Revenue</th><th>ROI on message cost</th></tr></thead><tbody>'];
  cs.forEach(function(c){
    var r=(c.revenue!==null&&c.spend>0)?c.revenue/c.spend:null;
    h.push('<tr><td>'+esc(c.name)+' <span class="status">'+esc(mlabel(c.month))+'</span></td>'
      +'<td class="n">'+cnt(c.sent)+'</td><td class="n">'+inr(c.spend,2)+'</td>'
      +'<td class="n">'+cnt(c.clicks)+'</td><td class="n">'+cnt(c.conversions)+'</td>'
      +'<td class="n">'+(c.revenue===null?"—":inr(c.revenue))+'</td>'
      +'<td class="n">'+roiPill(r)+'</td></tr>');
  });
  h.push('</tbody></table></div></div>');
  return h.join("");
}

function reconBlock(a){
  var rr=reconRows().filter(function(r){return monthStart(r.month)>=a.from&&monthEnd(r.month)<=a.to;});
  if(!rr.length)rr=reconRows();
  var h=['<div class="card"><h3>Does this tie to the Gupshup bill?</h3>'
   +'<p class="note">Our own message log priced at the tracked rates, plus the platform fee, plus GST at '
   +pc(S.cfg.gstRate,0)+', set against the invoice.</p>'
   +'<div class="scroll"><table><thead><tr><th>Month</th><th>Messages</th><th>Platform fee</th><th>GST</th>'
   +'<th>Our figure</th><th>Gupshup billed</th><th>Difference</th><th>Source</th></tr></thead><tbody>'];
  rr.forEach(function(r){
    var st=r.gapPc===null?'<span class="pill flat">not billed yet</span>'
      :(Math.abs(r.gapPc)<=0.05?'<span class="pill up">'+pc(r.gapPc)+'</span>'
        :'<span class="pill warn">'+pc(r.gapPc)+'</span>');
    h.push('<tr><td>'+esc(mlabel(r.month))+'</td><td class="n">'+inr(r.msgSpend,2)+'</td>'
      +'<td class="n">'+inr(r.fee)+'</td><td class="n">'+inr(r.gst,2)+'</td>'
      +'<td class="n"><b>'+inr(r.ours,2)+'</b></td><td class="n">'
      +(r.billed===null?"—":inr(r.billed,2))+'</td><td class="n">'
      +(r.gap===null?"—":inr(r.gap,2))+' '+st+'</td>'
      +'<td style="text-align:right">'+esc(r.source)
      +(r.invoiceNo?' <span class="status">'+esc(r.invoiceNo)+'</span>':'')+'</td></tr>');
  });
  h.push('</tbody></table></div>');
  var ck=rr.filter(function(r){return r.billed!==null;});
  if(ck.length){
    var w=0,b=0;ck.forEach(function(r){w+=r.ours;b+=r.billed;});
    h.push('<p class="hint"><b>Where we land:</b> across the '+ck.length+' month'+(ck.length>1?'s':'')
      +' we can check, our log accounts for '+inr(w)+' of the '+inr(b)+' billed, a difference of '
      +pc((w-b)/b)+'. Our figure sits a little under the bill every month, and that is expected: the '
      +'invoice covers every Gupshup app on the account, while the campaign log covers only the numbers '
      +'campaigns are sent from. The automated and transactional traffic on the other apps is real cost '
      +'we do not raise campaigns for.</p>');
  }
  h.push('</div>');
  return h.join("");
}

function narrow(){return (window.innerWidth||1200)<780;}
function CW(){return narrow()?420:900;}

/* ====================== leadership: area chart ====================== */
function areaChart(o){
  var W=o.width||640,H=o.height||170,T=16,B=24,R=6;
  var cats=o.cats||[],vals=o.values.map(function(v){return (v===null||!isFinite(v))?0:v;});
  var mx=Math.max.apply(null,vals.concat([0])),top=niceMax(mx*1.12)||1;
  var iw=W-R,ih=H-T-B,N=vals.length;
  var px=function(i){return N<=1?iw/2:R/2+(i/(N-1))*(iw-R);};
  var py=function(v){return T+ih-(top>0?(v/top)*ih:0);};
  var id="g"+Math.random().toString(36).slice(2,8);
  var s=['<svg class="chart trend" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'
    +esc(o.title||"trend")+'">'];
  s.push('<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+o.color+'" stop-opacity=".34"/>'
    +'<stop offset="100%" stop-color="'+o.color+'" stop-opacity="0"/></linearGradient></defs>');
  [0,.5,1].forEach(function(f){var y=T+ih-ih*f;
    s.push('<line x1="0" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)
      +'" stroke="var(--line)" stroke-width="1" stroke-dasharray="'+(f?"3 5":"0")+'"/>');});
  var d=vals.map(function(v,i){return (i?"L":"M")+px(i).toFixed(1)+" "+py(v).toFixed(1);}).join(" ");
  if(N===1)d="M"+(px(0)-30).toFixed(1)+" "+py(vals[0]).toFixed(1)+" L"+(px(0)+30).toFixed(1)+" "+py(vals[0]).toFixed(1);
  s.push('<path d="'+d+' L'+px(N-1).toFixed(1)+' '+(T+ih)+' L'+px(0).toFixed(1)+' '+(T+ih)
    +' Z" fill="url(#'+id+')"/>');
  s.push('<path d="'+d+'" fill="none" stroke="'+o.color+'" stroke-width="2.4" stroke-linejoin="round" '
    +'stroke-linecap="round"/>');
  vals.forEach(function(v,i){
    s.push('<circle cx="'+px(i).toFixed(1)+'" cy="'+py(v).toFixed(1)+'" r="'+(i===N-1?4.2:3)
      +'" fill="var(--surface)" stroke="'+o.color+'" stroke-width="2" data-t="'
      +esc((cats[i]||"")+" · "+o.fmt(o.values[i]))+'"/>');
  });
  if(N>1){
    var show=N<=7?vals.map(function(_,i){return i;})
      :[0,Math.floor((N-1)/3),Math.floor(2*(N-1)/3),N-1];
    show.forEach(function(i){
      var an=i===0?"start":(i===N-1?"end":"middle"),x=i===0?2:(i===N-1?W-2:px(i));
      s.push('<text x="'+(+x).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+an
        +'" font-size="11" fill="var(--ink-3)">'+esc(cats[i]||"")+'</text>');});
  }
  s.push('</svg>');
  return s.join("");
}
function deltaChip(m,cur,prev){
  if(!prev)return '<span class="delta none">no earlier period to compare</span>';
  var a=m.val(cur),b=m.val(prev);
  if(a===null||b===null||!isFinite(a)||!isFinite(b)||b===0)
    return '<span class="delta none">no comparison</span>';
  var ch=(a-b)/Math.abs(b);
  var good=(m.k==="bill"||m.k==="spend"||m.k==="feeGst"||m.k==="cpc"||m.k==="costPerConv")?ch<0:ch>0;
  return '<span class="delta '+(Math.abs(ch)<.005?"flat":(good?"up":"down"))+'">'
    +(ch>=0?"▲ ":"▼ ")+Math.abs(ch*100).toFixed(ch>1?0:1)+'% <i>vs the '
    +(spanDays(prev.from,prev.to)===1?"day":spanDays(prev.from,prev.to)+" days")
    +' before</i></span>';
}

function wireRail(){
  var rail=document.getElementById("rail");if(!rail)return;
  var prog=document.getElementById("rprog");
  function step(dir){
    var t=rail.querySelector(".tile");
    var w=t?t.getBoundingClientRect().width+14:260;
    var by=dir*w*Math.max(1,Math.floor(rail.clientWidth/w/1.6));
    try{rail.scrollBy({left:by,behavior:"smooth"});}catch(e){rail.scrollLeft+=by;}
    if(!rail.scrollBy)rail.scrollLeft+=by;
  }
  function upd(){
    if(!prog)return;
    var mx=rail.scrollWidth-rail.clientWidth;
    var w=Math.max(Math.min(1,rail.clientWidth/Math.max(rail.scrollWidth,1))*100,10);
    var p=mx<=1?0:rail.scrollLeft/mx;
    prog.style.width=w+"%";
    prog.style.marginLeft=(p*(100-w)).toFixed(2)+"%";
  }
  rail.addEventListener("scroll",upd,{passive:true});
  upd();
  var l=document.querySelector(".railnav.l"), r=document.querySelector(".railnav.r");
  if(l)l.onclick=function(){step(-1);};
  if(r)r.onclick=function(){step(1);};
  rail.onkeydown=function(e){
    if(e.key==="ArrowRight"){step(1);e.preventDefault();}
    if(e.key==="ArrowLeft"){step(-1);e.preventDefault();}
  };
  RAILSTEP=step;
}

/* ===================== bringing files in ===================== */
function parseCSV(text){
  var rows=[],row=[],cell="",q=false;
  text=text.replace(/^﻿/,"");
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else if(ch!=="\r")cell+=ch;}
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!=="";});});
}
function toIso(s){
  s=String(s==null?"":s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  var m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(!m)return "";
  var y=m[3].length===2?"20"+m[3]:m[3];
  return y+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
}
function guess(h,keys){h=String(h).toLowerCase();
  for(var i=0;i<keys.length;i++)if(h.indexOf(keys[i])>=0)return true;return false;}
/* A workbook arrives as [{name, rows:[[cell,...]]}] whatever it came from. */
function sheetsFromBuffer(buf){
  if(typeof XLSX==="undefined")throw new Error("reader-missing");
  var wb=XLSX.read(buf,{type:"array"});
  return wb.SheetNames.map(function(nm){
    return {name:nm,rows:XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,blankrows:false,raw:false})};
  });
}
function sheetsFromFile(f){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error("read-failed"));};
    if(/\.csv$|\.txt$/i.test(f.name)){
      fr.onload=function(){res([{name:f.name.replace(/\.[^.]+$/,""),rows:parseCSV(String(fr.result))}]);};
      fr.readAsText(f);
    }else{
      fr.onload=function(){
        try{res(sheetsFromBuffer(new Uint8Array(fr.result)));}catch(e){rej(e);}
      };
      fr.readAsArrayBuffer(f);
    }
  });
}
function sheetsFromLink(url){
  var m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!m)return Promise.reject(new Error("not-a-sheet-link"));
  return fetch("https://docs.google.com/spreadsheets/d/"+m[1]+"/export?format=xlsx")
    .then(function(r){if(!r.ok)throw new Error("http-"+r.status);return r.arrayBuffer();})
    .then(function(b){return sheetsFromBuffer(new Uint8Array(b));});
}
/* "CFA Level 1 Nudge - Qualified leads" -> campaign, cohort */
function splitTab(nm){
  var s=String(nm||"").trim();
  var m=s.split(/\s+[-–—|]\s+/);
  if(m.length>1)return {campaign:m[0].trim(),cohort:m.slice(1).join(" ").trim()};
  return {campaign:s,cohort:""};
}
function knownCampaigns(){
  var out={};
  allRows().forEach(function(r){var c=(r.campaign||"").trim();if(c)out[c.toLowerCase()]=c;});
  return out;
}
/* find the column in a header row that holds phones / emails / a named thing */
function findCol(head,keys){
  for(var i=0;i<head.length;i++)if(guess(head[i],keys))return i;
  return -1;
}

function takeOrders(sheet,name){

function takeAudience(sheets){
  if(!S.orders.length){document.getElementById("aud-out").innerHTML=
    msgBox("Load the purchase data first. The audience is trimmed to people who appear in it.","bad");return;}
  var known={};S.orders.forEach(function(o){(o.k||[]).forEach(function(k){known[k]=1;});});
  var inTracker=knownCampaigns(), tabs=[], kept=[], seen={};
  sheets.forEach(function(sh){
    var rows=sh.rows||[];if(rows.length<2)return;
    var head=rows[0].map(function(x){return String(x==null?"":x).trim();});
    var ph=findCol(head,["phone","mobile","number","contact"]), em=findCol(head,["email","mail"]);
    var sp=splitTab(sh.name), people=0, hits=0;
    if(ph<0&&em<0){tabs.push({tab:sh.name,campaign:sp.campaign,cohort:sp.cohort,people:0,hits:0,
      known:!!inTracker[sp.campaign.toLowerCase()],err:"no phone or email column"});return;}
    rows.slice(1).forEach(function(r){
      var ks=keysFrom([ph<0?"":r[ph],em<0?"":r[em]]);
      if(!ks.length)return;
      people++;
      ks.forEach(function(k){
        if(!known[k])return;
        var id=sp.campaign.toLowerCase()+"|"+k;if(seen[id])return;seen[id]=1;
        kept.push({campaign:sp.campaign,k:k});hits++;
      });
    });
    tabs.push({tab:sh.name,campaign:sp.campaign,cohort:sp.cohort,people:people,hits:hits,
      known:!!inTracker[sp.campaign.toLowerCase()],err:""});
  });
  S.aud=kept;writeBig("audience",{rows:kept});S.match=null;
  IMPREV={tabs:tabs,when:new Date().toISOString().slice(0,16).replace("T"," ")};
  viewImport();
}

    +'</div><div class="sub">across '+measured+' campaigns with a list</div></div>'
    +'<div class="kpi"><div class="cap">Revenue</div><div class="fig">'+cr(tot.r)+'</div>'
    +'<div class="sub">'+inr(tot.c?tot.r/tot.c:null)+' average order</div></div>'
    +'<div class="kpi"><div class="cap">No audience list</div><div class="fig">'+cnt(per.length-measured)
    +'</div><div class="sub">left out, never counted as zero</div></div></div>');
  h.push('<div class="card"><div class="scroll"><table><thead><tr><th>Campaign</th><th>Month</th>'
    +'<th>Rule used</th><th>Audience in purchases</th><th>Conversions</th><th>Revenue</th>'
    +'</tr></thead><tbody>');
  per.sort(function(a,b){return b.revenue-a.revenue;}).forEach(function(p){
    h.push('<tr><td>'+esc(p.name)+'</td><td style="text-align:right">'+esc(mlabel(p.month))
      +'</td><td style="text-align:right"><span class="pill flat">'+esc(p.rule)+'</span></td><td class="n">'
      +(p.measurable?cnt(p.audience):'—')+'</td><td class="n"><b>'
      +(p.measurable?cnt(p.conversions):'<span class="pill warn">no list</span>')+'</b></td><td class="n">'
      +(p.measurable?inr(p.revenue):"—")+'</td></tr>');
  });
  h.push('</tbody></table></div></div>');
  if(M.detail.length){
    h.push('<div class="card" style="margin-top:14px"><h3>Every credited purchase</h3>'
      +'<p class="note">One line per sale, so any figure here can be checked against the order itself.</p>'
      +'<div class="scroll"><table><thead><tr><th>Campaign</th><th>Contact</th><th>Sent</th><th>Bought</th>'
      +'<th>Product</th><th>Amount</th></tr></thead><tbody>');
    M.detail.slice(0,300).forEach(function(d){
      h.push('<tr><td>'+esc(d.campaign)+'</td><td class="n">'+esc(d.contact)+'</td><td class="n">'
        +esc(d.send||"")+'</td><td class="n">'+esc(d.date||"")+'</td><td style="text-align:right">'
        +esc(d.product)+'</td><td class="n">'+inr(d.amount)+'</td></tr>');
    });
    h.push('</tbody></table></div>'+(M.detail.length>300?'<p class="hint">First 300 of '
      +cnt(M.detail.length)+'. Save the report for all of them.</p>':'')+'</div>');
  }
  el.innerHTML=h.join("");
}

function viewSet(){
  var el=document.getElementById("v-set"),c=S.cfg;
  el.innerHTML='<div class="bar"><h2>Rates and benchmarks</h2></div><div class="panel"><div class="fields">'
   +fld("marketingRate","Marketing rate ₹ per delivered message",c.marketingRate,"0.0001")
   +fld("utilityRate","Utility rate ₹ per delivered message",c.utilityRate,"0.01")
   +fld("metaCPC","Meta benchmark cost per click ₹",c.metaCPC,"0.5")
   +fld("googleCPC","Google benchmark cost per click ₹",c.googleCPC,"0.5")
   +fld("platformFee","Platform fee ₹ per month",c.platformFee,"100")
   +fld("gstRate","GST rate",c.gstRate,"0.01")
   +fld("windowDays","Attribution window, days after the send",c.windowDays,"1")
   +'</div><p class="hint">Campaign cost is delivered messages multiplied by the rate for that message category. '
   +'The benchmarks are planning figures supplied by the growth team, not measured from a live ad account. '
   +'Change anything here and every figure on every tab follows.</p></div>'
   +(STANDALONE?('<div class="panel" style="margin-top:14px"><h2 style="font-size:16px;font-weight:600">'
     +'Your data</h2><p class="hint" style="margin-top:4px">On this address your edits are kept in this '
     +'browser only, so they do not reach anyone else until the page is rebuilt. Save the file and send it '
     +'over, and the next build carries your changes for everyone.</p>'
     +'<div class="bar" style="margin-top:12px"><a class="btn primary" id="dl" download="campaign-signal-data.json">'
     +'Save my data to a file</a><button class="btn" id="ld">Load a data file</button>'
     +'<input type="file" id="ldf" accept=".json" hidden><span class="status" id="io-msg"></span></div></div>'):'');
  el.querySelectorAll("[data-cfg]").forEach(function(i){
    i.addEventListener("change",function(){
      var v=parseFloat(i.value);if(isFinite(v)){S.cfg[i.getAttribute("data-cfg")]=v;saveCfg();viewLead();viewData();}
    });
  });
  var dl=el.querySelector("#dl");
  if(dl){
    dl.href=URL.createObjectURL(new Blob([JSON.stringify(
      {months:S.months,invoices:S.inv,config:S.cfg,stamp:new Date().toISOString().slice(0,10)},null,1)],
      {type:"application/json"}));
    var ldf=el.querySelector("#ldf");
    el.querySelector("#ld").onclick=function(){ldf.click();};
    ldf.onchange=function(){
      var f=ldf.files[0];if(!f)return;
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var d=JSON.parse(String(fr.result));
          if(d.config)S.cfg=Object.assign({},DEF,d.config);
          Object.keys(d.months||{}).forEach(function(k){S.months[k]=d.months[k];save(k);});
          Object.keys(d.invoices||{}).forEach(function(k){S.inv[k]=d.invoices[k];saveInv(k);});
          saveCfg();el.querySelector("#io-msg").textContent="Loaded.";viewLead();viewSet();
        }catch(e){el.querySelector("#io-msg").textContent="That file could not be read as campaign data.";}
      };
      fr.readAsText(f);
    };
  }
}
function fld(k,label,v,step){
  return '<div class="field"><label for="c-'+k+'">'+esc(label)+'</label>'
    +'<input id="c-'+k+'" type="number" step="'+step+'" data-cfg="'+k+'" value="'+v+'"></div>';
}

/* ============================ persistence ============================ */
var timers={};
function save(month){
  render();
  if(!S.months[month])return;
  clearTimeout(timers[month]);
  timers[month]=setTimeout(function(){
    stamp("Saving…");
    write("months/"+month,{month:month,rows:S.months[month].rows}).then(function(ok){
      stamp(ok?"Saved":"Saved on this device only");});
  },700);
}
function saveCfg(){
  clearTimeout(timers.cfg);
  timers.cfg=setTimeout(function(){write("settings/config",S.cfg);},500);
}
function stamp(t){var e=document.getElementById("saved");if(e)e.textContent=t;}
function writeBig(name,data){return write("bulk/"+name,data);}
function write(path,data){
  try{localStorage.setItem("cs:"+path,JSON.stringify(data));}catch(e){}
  if(!S.db)return Promise.resolve(false);
  return S.db.doc(path).set(data).then(function(){return true;}).catch(function(){return false;});
}
function render(){viewLead();}

/* ============================ boot ============================ */
function switchTo(id){
  [["t-lead","v-lead"],["t-data","v-data"],["t-inv","v-inv"],["t-imp","v-imp"],
   ["t-set","v-set"]].forEach(function(p){
    var on=p[0]===id;
    document.getElementById(p[0]).setAttribute("aria-selected",on?"true":"false");
    document.getElementById(p[1]).hidden=!on;
  });
  if(id==="t-data")viewData();
  if(id==="t-inv")viewInv();
  if(id==="t-imp")viewImport();
  if(id==="t-set")viewSet();
  try{localStorage.setItem("cs:tab",id);}catch(e){}
}
["t-lead","t-data","t-inv","t-imp","t-set"].forEach(function(id){
  document.getElementById(id).onclick=function(){switchTo(id);};});

function fromSeed(){                       /* so the page is never blank for a viewer without db */
  try{
    var el=document.getElementById("seed");
    if(!el)return;
    var d=JSON.parse(el.textContent||"{}");
    if(d.config)S.cfg=Object.assign({},DEF,d.config);
    Object.keys(d.months||{}).forEach(function(k){S.months[k]=d.months[k];});
    Object.keys(d.invoices||{}).forEach(function(k){S.inv[k]=d.invoices[k];});
  }catch(e){}
}
function fromLocal(){
  try{
    var cfg=localStorage.getItem("cs:settings/config");
    if(cfg)S.cfg=Object.assign({},DEF,JSON.parse(cfg));
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf("cs:months/")===0){var d=JSON.parse(localStorage.getItem(k));if(d&&d.month)S.months[d.month]=d;}
      if(k&&k.indexOf("cs:invoices/")===0){var v=JSON.parse(localStorage.getItem(k));if(v&&v.month)S.inv[v.month]=v;}
    }
    var ob=localStorage.getItem("cs:bulk/orders");if(ob)S.orders=(JSON.parse(ob)||{}).rows||[];
    var ab=localStorage.getItem("cs:bulk/audience");if(ab)S.aud=(JSON.parse(ab)||{}).rows||[];
  }catch(e){}
}
function boot(){
  fromSeed();
  fromLocal();
  try{var p=localStorage.getItem("cs:range");
    if(p){var q=JSON.parse(p);if(q&&q.k)RG=Object.assign({k:"all",month:"",from:"",to:""},q);}
  }catch(e){}
  render();
  try{var t=localStorage.getItem("cs:tab");if(t)switchTo(t);}catch(e){}
  if(!window.claude||!window.claude.use)return;
  window.claude.use("db").then(function(db){
    if(!db)return;
    S.db=db;
    return Promise.all([
      db.doc("settings/config").get().then(function(d){
        if(d&&d.exists)S.cfg=Object.assign({},DEF,d.data()||{});
      }).catch(function(){}),
      db.collection("months").get().then(function(res){
        ((res&&res.docs)||[]).forEach(function(d){
          var v=d.exists?d.data():null;
          if(v&&v.month)S.months[v.month]=v;
        });
      }).catch(function(){}),
      db.collection("invoices").get().then(function(res){
        ((res&&res.docs)||[]).forEach(function(d){
          var v=d.exists?d.data():null;
          if(v&&v.month)S.inv[v.month]=v;
        });
      }).catch(function(){}),
      db.doc("bulk/orders").get().then(function(d){
        if(d&&d.exists)S.orders=(d.data()||{}).rows||S.orders;}).catch(function(){}),
      db.doc("bulk/audience").get().then(function(d){
        if(d&&d.exists)S.aud=(d.data()||{}).rows||S.aud;}).catch(function(){})
    ]).then(function(){
      render();
      var open=document.querySelector('.tab[aria-selected="true"]');
      if(open&&open.id!=="t-lead")switchTo(open.id);
    });
  }).catch(function(){});
}
boot();
})();
</script>
