          :"The browser could not read that sheet. Open it, choose Share, and set it to "
           +"“anyone with the link can view”. If it is already shared, download it with "
           +"File › Download › Microsoft Excel and drop the file in below.","bad");
      });
  };
  var w=el.querySelector("#win");
  if(w)w.onchange=function(){var v=parseInt(w.value,10);
    if(v>0){S.cfg.windowDays=v;saveCfg();S.match=null;viewImport();}};
  var run=el.querySelector("#run");
  if(run)run.onclick=function(){runMatch();viewImport();};
  var ap=el.querySelector("#apply");
  if(ap)ap.onclick=function(){
    var k=applyMatch();
    el.querySelector("#m-msg").textContent=k+" campaign"+(k===1?"":"s")+" updated.";
    viewLead();};
  var dl=el.querySelector("#dlrep");
  if(dl&&S.match){
    var head="Campaign,Month,Contact,Sent,Bought,Product,Amount,Coupon,Rule\n";
    var body=S.match.detail.map(function(d){
      return [d.campaign,d.month,d.contact,d.send,d.date,d.product,d.amount,d.coupon,d.rule]
        .map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
    dl.href=URL.createObjectURL(new Blob([head+body],{type:"text/csv"}));
  }
}
function msgBox(t,kind){
  return '<p class="msg'+(kind?" "+kind:"")+'">'+esc(t)+'</p>';
}
function takeFile(f,kind){
  var out=document.getElementById(kind==="orders"?"ord-out":(kind==="sources"?"src-out":"aud-out"));
  out.innerHTML=msgBox("Reading "+f.name+"…","");
  sheetsFromFile(f).then(function(sh){
    if(kind==="orders")takeOrders(sh[0],f.name);
    else if(kind==="sources")takeSources(sh[0],f.name);
    else takeAudience(sh);
  }).catch(function(e){
    out.innerHTML=msgBox(e.message==="reader-missing"
      ?"The spreadsheet reader did not load. Refresh the page and try again, or save the file as CSV."
      :"That file could not be read.","bad");
  });
}
/* ---------- the dated source history from the CRM ---------- */
function takeSources(sheet,name){
  var rows=sheet.rows||[];
  if(rows.length<2){document.getElementById("src-out").innerHTML=
    msgBox("That file has no rows under its header.","bad");return;}
  var head=rows[0].map(function(x){return String(x==null?"":x).trim();});
  var ph=findCol(head,["phone","mobile","number","contact"]),
      em=findCol(head,["email","mail"]),
      sc=findCol(head,["source","channel","medium"]),
      dt=findCol(head,["date","on","touch","changed","created"]);
  if(sc<0||dt<0){document.getElementById("src-out").innerHTML=
    msgBox("That file needs a source column and a date column. Found: "+esc(head.join(", ")),"bad");return;}
  var got=[],skipped=0;
  rows.slice(1).forEach(function(r){
    var ks=keysFrom([ph<0?"":r[ph],em<0?"":r[em]]);
    var d=toIso(r[dt]), src=String(r[sc]||"").trim();
    if(!ks.length||!d||!src){skipped++;return;}
    ks.forEach(function(k){got.push({k:k,source:src,date:d});});
  });
  S.src=got;writeBig("sources",{rows:got});S.match=null;
  viewImport();
}
/* ---------- purchases ---------- */
function takeOrders(sheet,name){
  var rows=sheet.rows||[];
  if(rows.length<2){document.getElementById("ord-out").innerHTML=
    msgBox("That file has no rows under its header.","bad");return;}
  var head=rows[0].map(function(x){return String(x==null?"":x).trim();});
  var ph=findCol(head,["phone","mobile","number","contact"]),
      em=findCol(head,["email","mail"]),
      dt=findCol(head,["paid","order date","date"]),
      pr=findCol(head,["course","product","item","name"]),
      am=findCol(head,["amount","total","value","price"]),
      cp=findCol(head,["coupon","code"]);
  var got=[],skipped=0;
  rows.slice(1).forEach(function(r){
    var ks=keysFrom([ph<0?"":r[ph],em<0?"":r[em]]);
    var amt=am<0?null:num(r[am]);
    if(!ks.length||amt===null){skipped++;return;}
    got.push({k:ks,date:toIso(dt<0?"":r[dt]),product:pr<0?"":String(r[pr]||"").trim(),
      amount:amt,coupon:cp<0?"":String(r[cp]||"").trim()});
  });
  ORDPREV={name:name,total:rows.length-1,kept:got.length,skipped:skipped,
    cols:{phone:ph,email:em,date:dt,product:pr,amount:am,coupon:cp},head:head};
  S.orders=got;writeBig("orders",{rows:got});S.match=null;
  viewImport();
}
function renderOrdPrev(){
  var el=document.getElementById("ord-out");if(!el)return;
  if(!ORDPREV&&!S.orders.length)return;
  if(!ORDPREV){el.innerHTML=msgBox(cnt(S.orders.length)+" purchases held from an earlier import.","ok");return;}
  var c=ORDPREV.cols,named=[];
  [["phone","Phone"],["email","Email"],["date","Order date"],["product","Product"],["amount","Amount"],
   ["coupon","Coupon"]].forEach(function(p){
    named.push('<span class="tagx'+(c[p[0]]<0?" miss":"")+'">'+esc(p[1])+(c[p[0]]<0?" not found"
      :": "+esc(ORDPREV.head[c[p[0]]]))+'</span>');});
  el.innerHTML=msgBox(cnt(ORDPREV.kept)+" purchases loaded from "+ORDPREV.name
    +(ORDPREV.skipped?", "+cnt(ORDPREV.skipped)+" skipped for no contact or no amount":"")+".","ok")
    +'<div class="tags">'+named.join("")+'</div>';
}
/* ---------- audience ---------- */
function takeAudience(sheets){
  if(!S.orders.length){document.getElementById("aud-out").innerHTML=
    msgBox("Load the purchase data first. The audience is trimmed to people who appear in it.","bad");return;}
  var known={};S.orders.forEach(function(o){(o.k||[]).forEach(function(k){known[k]=1;});});
  var inTracker=knownCampaigns(), tabs=[], kept=[], seen={};
  sheets.forEach(function(sh){
    var rows=sh.rows||[];if(rows.length<2)return;
    var head=rows[0].map(function(x){return String(x==null?"":x).trim();});
    var ph=findCol(head,["phone","mobile","number","contact"]), em=findCol(head,["email","mail"]);
    var sp=splitTab(sh.name), people=0, hits=0;
    if(ph<0&&em<0){tabs.push({tab:sh.name,campaign:sp.campaign,cohort:sp.cohort,people:0,hits:0,
      known:!!inTracker[sp.campaign.toLowerCase()],err:"no phone or email column"});return;}
    rows.slice(1).forEach(function(r){
      var ks=keysFrom([ph<0?"":r[ph],em<0?"":r[em]]);
      if(!ks.length)return;
      people++;
      ks.forEach(function(k){
        if(!known[k])return;
        var id=sp.campaign.toLowerCase()+"|"+k;if(seen[id])return;seen[id]=1;
        kept.push({campaign:sp.campaign,k:k});hits++;
      });
    });
    tabs.push({tab:sh.name,campaign:sp.campaign,cohort:sp.cohort,people:people,hits:hits,
      known:!!inTracker[sp.campaign.toLowerCase()],err:""});
  });
  S.aud=kept;writeBig("audience",{rows:kept});S.match=null;
  IMPREV={tabs:tabs,when:new Date().toISOString().slice(0,16).replace("T"," ")};
  viewImport();
}
function renderAudPrev(){
  var el=document.getElementById("aud-out");if(!el)return;
  if(!IMPREV){if(S.aud.length)el.innerHTML=msgBox(cnt(S.aud.length)
    +" matched audience rows held from an earlier import.","ok");return;}
  var t=IMPREV.tabs, ppl=0, hits=0, unknown=0;
  t.forEach(function(x){ppl+=x.people;hits+=x.hits;if(!x.known)unknown++;});
  var h=[msgBox(t.length+" tab"+(t.length===1?"":"s")+" read · "+cnt(ppl)+" people · "+cnt(hits)
    +" of them appear in the purchase data and were kept.","ok")];
  h.push('<div class="scroll"><table class="mini"><thead><tr><th>Tab</th><th>Campaign</th><th>Cohort</th>'
    +'<th>People</th><th>In purchase data</th><th></th></tr></thead><tbody>');
  t.forEach(function(x){
    h.push('<tr><td>'+esc(x.tab)+'</td><td>'+esc(x.campaign)+'</td><td>'+esc(x.cohort||"—")
      +'</td><td class="n">'+cnt(x.people)+'</td><td class="n">'+cnt(x.hits)+'</td><td style="text-align:right">'
      +(x.err?'<span class="pill warn">'+esc(x.err)+'</span>'
        :(x.known?'<span class="pill up">campaign found</span>'
          :'<span class="pill warn">no campaign of this name</span>'))+'</td></tr>');
  });
  h.push('</tbody></table></div>');
  if(unknown)h.push('<p class="hint">A tab marked <b>no campaign of this name</b> will not match anything. '
    +'The part of the tab name before the dash has to equal the campaign name on the Campaigns tab.</p>');
  el.innerHTML=h.join("");
}
/* ---------- the result ---------- */
function renderResult(){
  var el=document.getElementById("res");if(!el||!S.match)return;
  var M=S.match, per=Object.keys(M.per).map(function(k){return M.per[k];});
  var tot=per.reduce(function(a,p){a.c+=p.conversions;a.r+=p.revenue;return a;},{c:0,r:0});
  var measured=per.filter(function(p){return p.measurable;}).length;
  var lost=per.reduce(function(a,p){a.c+=(p.lost||0);a.r+=(p.lostRevenue||0);return a;},{c:0,r:0});
  var h=['<div class="bar" style="margin-top:26px"><h2>Conversions by campaign</h2>'
    +'<span class="status">matched '+esc(M.when)+' · '+(M.window||60)+' day window</span></div>'];
  h.push(M.haveSrc
    ? msgBox("Checked against "+cnt(M.sources)+" lead source touches from the CRM. "
        +cnt(lost.c)+" sale"+(lost.c===1?"":"s")+" worth "+inr(lost.r)+" belonged to a non-organic "
        +"source on the day "+(lost.c===1?"it":"they")+" paid"
        +(M.noOwner?", "+cnt(M.noOwner)+" had no owner at all because every 60 day window had lapsed":"")
        +(M.noMsg?", and "+cnt(M.noMsg)+" were organic but no campaign of ours reached them inside the "
          +"window":"")+".","ok")
    : msgBox("No lead source file loaded in this browser, so nothing can be attributed at all and this "
        +"re-match reads zero. The rule starts from the lead source: without it there is no way to know "
        +"who owned the lead when it paid. Add the source history in step 3 and run the match again.",
        "bad"));
  h.push('<div class="kpis"><div class="kpi"><div class="cap">Conversions</div><div class="fig">'+cnt(tot.c)
    +'</div><div class="sub">across '+measured+' campaigns with a list</div></div>'
    +'<div class="kpi"><div class="cap">Revenue</div><div class="fig">'+cr(tot.r)+'</div>'
    +'<div class="sub">'+inr(tot.c?tot.r/tot.c:null)+' average order</div></div>'
    +'<div class="kpi"><div class="cap">Owned by a non-organic source</div><div class="fig">'+cnt(lost.c)
    +'</div><div class="sub">'+(M.haveSrc?inr(lost.r)+' of revenue, not ours to claim'
      :'not tested, no source file')+'</div></div>'
    +'<div class="kpi"><div class="cap">No audience list</div><div class="fig">'+cnt(per.length-measured)
    +'</div><div class="sub">left out, never counted as zero</div></div></div>');
  h.push('<div class="card"><div class="scroll"><table><thead><tr><th>Campaign</th><th>Month</th>'
    +'<th>Rule used</th><th>Audience in purchases</th><th>Conversions</th><th>Revenue</th>'
    +'<th>Lost to another channel</th></tr></thead><tbody>');
  per.sort(function(a,b){return b.revenue-a.revenue;}).forEach(function(p){
    h.push('<tr><td>'+esc(p.name)+'</td><td style="text-align:right">'+esc(mlabel(p.month))
      +'</td><td style="text-align:right"><span class="pill flat">'+esc(p.rule)+'</span></td><td class="n">'
      +(p.measurable?cnt(p.audience):'—')+'</td><td class="n"><b>'
      +(p.measurable?cnt(p.conversions):'<span class="pill warn">no list</span>')+'</b></td><td class="n">'
      +(p.measurable?inr(p.revenue):"—")+'</td><td class="n">'
      +(!M.haveSrc?'<span class="pill flat">not tested</span>'
        :(p.lost?cnt(p.lost)+' \u00b7 '+inr(p.lostRevenue):'<span class="pill up">none</span>'))+'</td></tr>');
  });
  h.push('</tbody></table></div></div>');
  if(M.detail.length){
    h.push('<div class="card" style="margin-top:14px"><h3>Every credited purchase</h3>'
      +'<p class="note">One line per sale, so any figure here can be checked against the order itself.</p>'
      +'<div class="scroll"><table><thead><tr><th>Campaign</th><th>Contact</th><th>Sent</th><th>Bought</th>'
      +'<th>Product</th><th>Amount</th></tr></thead><tbody>');
    M.detail.slice(0,300).forEach(function(d){
      h.push('<tr><td>'+esc(d.campaign)+'</td><td class="n">'+esc(d.contact)+'</td><td class="n">'
        +esc(d.send||"")+'</td><td class="n">'+esc(d.date||"")+'</td><td style="text-align:right">'
        +esc(d.product)+'</td><td class="n">'+inr(d.amount)+'</td></tr>');
    });
    h.push('</tbody></table></div>'+(M.detail.length>300?'<p class="hint">First 300 of '
      +cnt(M.detail.length)+'. Save the report for all of them.</p>':'')+'</div>');
  }
  el.innerHTML=h.join("");
}

function viewSet(){
  var el=document.getElementById("v-set"),c=S.cfg;
  el.innerHTML='<div class="bar"><h2>Rates and benchmarks</h2></div><div class="panel"><div class="fields">'
   +fld("marketingRate","Marketing rate ₹ per delivered message",c.marketingRate,"0.0001")
   +fld("utilityRate","Utility rate ₹ per delivered message",c.utilityRate,"0.01")
   +fld("metaCPC","Meta benchmark cost per click ₹",c.metaCPC,"0.5")
   +fld("googleCPC","Google benchmark cost per click ₹",c.googleCPC,"0.5")
   +fld("platformFee","Platform fee ₹ per month",c.platformFee,"100")
   +fld("gstRate","GST rate",c.gstRate,"0.01")
   +fld("windowDays","Attribution window, days after the send",c.windowDays,"1")
   +'</div>'
   +'<label class="switch"><input type="checkbox" id="cproof"'+(c.couponProof!==false?" checked":"")
   +'><span><b>A campaign coupon overrides the last touch test</b>Leave this off unless a coupon code was '
   +'given out on WhatsApp and nowhere else. It is off today because the one coupon campaign we have, the '
   +'Website Wide Site Offer, was a site-wide launch discount promoted on the website at the same time, so '
   +'the code proves nothing about which channel did the work. Turning it on adds 42 sales and '
   +inr(1172064)+' back to WhatsApp that the CRM says the website touched last.</span></label>'
   +'<p class="hint">Campaign cost is delivered messages multiplied by the rate for that message category. '
   +'The benchmarks are planning figures supplied by the growth team, not measured from a live ad account. '
   +'Change anything here and every figure on every tab follows.</p></div>'
   +(STANDALONE?('<div class="panel" style="margin-top:14px"><h2 style="font-size:16px;font-weight:600">'
     +'Your data</h2><p class="hint" style="margin-top:4px">On this address your edits are kept in this '
     +'browser only, so they do not reach anyone else until the page is rebuilt. Save the file and send it '
     +'over, and the next build carries your changes for everyone.</p>'
     +'<div class="bar" style="margin-top:12px"><a class="btn primary" id="dl" download="campaign-signal-data.json">'
     +'Save my data to a file</a><button class="btn" id="ld">Load a data file</button>'
     +'<input type="file" id="ldf" accept=".json" hidden><span class="status" id="io-msg"></span></div></div>'):'');
  el.querySelectorAll("[data-cfg]").forEach(function(i){
    i.addEventListener("change",function(){
      var v=parseFloat(i.value);if(isFinite(v)){S.cfg[i.getAttribute("data-cfg")]=v;saveCfg();viewLead();viewData();}
    });
  });
  var cp=el.querySelector("#cproof");
  if(cp)cp.onchange=function(){S.cfg.couponProof=cp.checked;saveCfg();S.match=null;};
  var dl=el.querySelector("#dl");
  if(dl){
    dl.href=URL.createObjectURL(new Blob([JSON.stringify(
      {months:S.months,invoices:S.inv,config:S.cfg,docs:S.docs,
       stamp:new Date().toISOString().slice(0,10)},null,1)],
      {type:"application/json"}));
    var ldf=el.querySelector("#ldf");
    el.querySelector("#ld").onclick=function(){ldf.click();};
    ldf.onchange=function(){
      var f=ldf.files[0];if(!f)return;
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var d=JSON.parse(String(fr.result));
          if(d.config)S.cfg=Object.assign({},DEF,d.config);
          if(d.docs){S.docs=Object.assign({},d.docs);saveDocs();}
          Object.keys(d.months||{}).forEach(function(k){S.months[k]=d.months[k];save(k);});
          Object.keys(d.invoices||{}).forEach(function(k){S.inv[k]=d.invoices[k];saveInv(k);});
          saveCfg();el.querySelector("#io-msg").textContent="Loaded.";viewLead();viewSet();
        }catch(e){el.querySelector("#io-msg").textContent="That file could not be read as campaign data.";}
      };
      fr.readAsText(f);
    };
  }
}
function fld(k,label,v,step){
  return '<div class="field"><label for="c-'+k+'">'+esc(label)+'</label>'
    +'<input id="c-'+k+'" type="number" step="'+step+'" data-cfg="'+k+'" value="'+v+'"></div>';
}

/* ============================ persistence ============================ */
var timers={};
function save(month){
  render();
  if(!S.months[month])return;
  clearTimeout(timers[month]);
  timers[month]=setTimeout(function(){
    stamp("Saving…");
    write("months/"+month,{month:month,rows:S.months[month].rows}).then(function(ok){
      stamp(ok?"Saved":"Saved on this device only");});
  },700);
}
function saveCfg(){
  clearTimeout(timers.cfg);
  timers.cfg=setTimeout(function(){write("settings/config",S.cfg);},500);
}
function stamp(t){var e=document.getElementById("saved");if(e)e.textContent=t;}
function writeBig(name,data){return write("bulk/"+name,data);}
function write(path,data){
  try{localStorage.setItem("cs:"+path,JSON.stringify(data));}catch(e){}
  if(!S.db)return Promise.resolve(false);
  return S.db.doc(path).set(data).then(function(){return true;}).catch(function(){return false;});
}
function render(){viewLead();}

/* ============================ boot ============================ */
function switchTo(id){
  [["t-lead","v-lead"],["t-met","v-met"],["t-data","v-data"],["t-inv","v-inv"],
   ["t-imp","v-imp"],["t-set","v-set"]].forEach(function(p){
    var on=p[0]===id;
    document.getElementById(p[0]).setAttribute("aria-selected",on?"true":"false");
    document.getElementById(p[1]).hidden=!on;
  });
  if(id==="t-data")viewData();
  if(id==="t-inv")viewInv();
  if(id==="t-imp")viewImport();
  if(id==="t-met")viewMethod();
  if(id==="t-set")viewSet();
  try{localStorage.setItem("cs:tab",id);}catch(e){}
}
["t-lead","t-met","t-data","t-inv","t-imp","t-set"].forEach(function(id){
  document.getElementById(id).onclick=function(){switchTo(id);};});

function fromSeed(){                       /* so the page is never blank for a viewer without db */
  try{
    var el=document.getElementById("seed");
    if(!el)return;
    var d=JSON.parse(el.textContent||"{}");
    if(d.config)S.cfg=Object.assign({},DEF,d.config);
    Object.keys(d.months||{}).forEach(function(k){S.months[k]=d.months[k];});
    Object.keys(d.invoices||{}).forEach(function(k){S.inv[k]=d.invoices[k];});
    if(d.docs)S.docs=Object.assign({},d.docs);
  }catch(e){}
}
function fromLocal(){
  try{
    var cfg=localStorage.getItem("cs:settings/config");
    if(cfg)S.cfg=Object.assign({},DEF,JSON.parse(cfg));
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf("cs:months/")===0){var d=JSON.parse(localStorage.getItem(k));if(d&&d.month)S.months[d.month]=d;}
      if(k&&k.indexOf("cs:invoices/")===0){var v=JSON.parse(localStorage.getItem(k));if(v&&v.month)S.inv[v.month]=v;}
    }
    var ob=localStorage.getItem("cs:bulk/orders");if(ob)S.orders=(JSON.parse(ob)||{}).rows||[];
    var ab=localStorage.getItem("cs:bulk/audience");if(ab)S.aud=(JSON.parse(ab)||{}).rows||[];
    var sb=localStorage.getItem("cs:bulk/sources");if(sb)S.src=(JSON.parse(sb)||{}).rows||[];
    var db=localStorage.getItem("cs:settings/docs");if(db)S.docs=JSON.parse(db)||{};
  }catch(e){}
}
function boot(){
  fromSeed();
  fromLocal();
  try{var p=localStorage.getItem("cs:range");
    if(p){var q=JSON.parse(p);if(q&&q.k)RG=Object.assign({k:"all",month:"",from:"",to:""},q);}
  }catch(e){}
  render();
  try{var t=localStorage.getItem("cs:tab");if(t)switchTo(t);}catch(e){}
  if(!window.claude||!window.claude.use)return;
  window.claude.use("db").then(function(db){
    if(!db)return;
    S.db=db;
    return Promise.all([
      db.doc("settings/config").get().then(function(d){
        if(d&&d.exists)S.cfg=Object.assign({},DEF,d.data()||{});
      }).catch(function(){}),
      db.collection("months").get().then(function(res){
        ((res&&res.docs)||[]).forEach(function(d){
          var v=d.exists?d.data():null;
          if(v&&v.month)S.months[v.month]=v;
        });
      }).catch(function(){}),
      db.collection("invoices").get().then(function(res){
        ((res&&res.docs)||[]).forEach(function(d){
          var v=d.exists?d.data():null;
          if(v&&v.month)S.inv[v.month]=v;
        });
      }).catch(function(){}),
      db.doc("bulk/orders").get().then(function(d){
        if(d&&d.exists)S.orders=(d.data()||{}).rows||S.orders;}).catch(function(){}),
      db.doc("bulk/audience").get().then(function(d){
        if(d&&d.exists)S.aud=(d.data()||{}).rows||S.aud;}).catch(function(){}),
      db.doc("bulk/sources").get().then(function(d){
        if(d&&d.exists)S.src=(d.data()||{}).rows||S.src;}).catch(function(){}),
      db.doc("settings/docs").get().then(function(d){
        if(d&&d.exists)S.docs=d.data()||S.docs;}).catch(function(){})
    ]).then(function(){
      render();
      var open=document.querySelector('.tab[aria-selected="true"]');
      if(open&&open.id!=="t-lead")switchTo(open.id);
    });
  }).catch(function(){});
}
boot();
})();
