<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Growth &amp; Ops</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e5f74'/%3E%3Crect x='6' y='14.5' width='20' height='3.4' rx='1.7' fill='%23ffffff' opacity='.28'/%3E%3Crect x='6' y='14.5' width='12' height='3.4' rx='1.7' fill='%23ffffff'/%3E%3Crect x='21' y='11.5' width='1.8' height='9.4' rx='.9' fill='%23ffffff'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;550;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=2">

    <style>
        .signin {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--s5);
        }
        .signin-card {
            width: 100%;
            max-width: 360px;
        }
        .signin-mark {
            width: 34px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
            margin-bottom: var(--s4);
        }
        .signin-form {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: var(--s5);
            margin-top: var(--s5);
        }
        .error-message {
            display: none;
            padding: var(--s3);
            margin-bottom: var(--s4);
            background: var(--bad-wash);
            color: var(--bad);
            border-radius: var(--radius-sm);
            font-size: 12.5px;
        }
    </style>
</head>
<body>

<div class="signin">
    <div class="signin-card">
        <div class="signin-mark"></div>
        <h1 class="h-page">Growth &amp; Ops</h1>
        <p class="meta">Goals, scorecards and delegations for the SSEI growth team.</p>

        <form class="signin-form" id="login-form" autocomplete="off">
            <div id="login-error" class="error-message"></div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center">
                Sign in
            </button>

            <p class="meta" style="margin-top:var(--s4);text-align:center">
                No account yet? <a href="#" id="signup-link">Create one</a>
            </p>
        </form>
    </div>
</div>

<div class="modal-backdrop" id="signup-modal" style="display:none">
    <div class="modal">
        <form id="signup-form">
            <div class="modal-head">
                <h3 class="h-block">Create your account</h3>
                <button type="button" class="icon-btn" id="close-signup" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="signup-error" class="error-message"></div>
                <div class="field">
                    <label for="signup-name">Full name</label>
                    <input type="text" id="signup-name" name="name" required>
                </div>
                <div class="field">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" required>
                </div>
                <div class="field">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" required minlength="6">
                    <p class="field-hint">At least 6 characters.</p>
                </div>
                <p class="field-hint">
                    New accounts start with view access. Ask Kavya to set your role and
                    link you to your KPIs.
                </p>
            </div>
            <div class="modal-foot">
                <button type="submit" class="btn btn-primary">Create account</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=11"></script>
<script src="js/data.js?v=11"></script>
<script src="js/auth.js?v=11"></script>
<script>
    // Match the theme the person last used on the dashboard.
    document.documentElement.setAttribute('data-theme',
        localStorage.getItem('go-theme') || 'light');
</script>
</body>
</html>
