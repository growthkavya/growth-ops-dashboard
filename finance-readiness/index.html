<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A role-based finance skills gap assessment for students and early-career aspirants, by SSEI.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129517;</text></svg>">
<title>Finance Readiness Compass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface2: #edf0f7;
    --ink: #17233c;
    --ink-soft: #45526b;
    --ink-faint: #6e7b93;
    --heading: #0e2a5e;
    --navy: #0e2a5e;
    --navy-soft: #1d3e7d;
    --gold: #d4a02b;
    --gold-deep: #a87c15;
    --gold-tint: #fbf4e2;
    --line: #d9dfeb;
    --line-strong: #c3ccdd;
    --good: #1e7d54;
    --good-bg: #e2f2ea;
    --mid: #a06d0c;
    --mid-bg: #f7edd6;
    --bad: #b3462f;
    --bad-bg: #f9e7e1;
    --btn-bg: #0e2a5e;
    --btn-ink: #ffffff;
    --shadow: 0 1px 2px rgba(14, 42, 94, 0.06), 0 8px 24px rgba(14, 42, 94, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1423;
      --surface: #121f36;
      --surface2: #0f1a2d;
      --ink: #e8edf7;
      --ink-soft: #b6c1d6;
      --ink-faint: #8492ac;
      --heading: #dce6f8;
      --navy: #0e2a5e;
      --navy-soft: #2c4c8d;
      --gold: #e0b04a;
      --gold-deep: #efc873;
      --gold-tint: #2a2410;
      --line: #253753;
      --line-strong: #33486a;
      --good: #56c48f;
      --good-bg: #14301f;
      --mid: #e2b04c;
      --mid-bg: #33270e;
      --bad: #e57860;
      --bad-bg: #391c14;
      --btn-bg: #e0b04a;
      --btn-ink: #101c31;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1423;
    --surface: #121f36;
    --surface2: #0f1a2d;
    --ink: #e8edf7;
    --ink-soft: #b6c1d6;
    --ink-faint: #8492ac;
    --heading: #dce6f8;
    --navy: #0e2a5e;
    --navy-soft: #2c4c8d;
    --gold: #e0b04a;
    --gold-deep: #efc873;
    --gold-tint: #2a2410;
    --line: #253753;
    --line-strong: #33486a;
    --good: #56c48f;
    --good-bg: #14301f;
    --mid: #e2b04c;
    --mid-bg: #33270e;
    --bad: #e57860;
    --bad-bg: #391c14;
    --btn-bg: #e0b04a;
    --btn-ink: #101c31;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", "Segoe UI", -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 760px;
    margin: 0 auto;
    padding: 22px 24px 0;
  }
  .wordmark { font-weight: 800; letter-spacing: 0.14em; font-size: 15px; color: var(--heading); }
  .wordmark span { color: var(--gold); }
  .topbar-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }
  .stage { max-width: 760px; margin: 0 auto; padding: 20px 24px 72px; }
  .screen { animation: rise 0.35s ease both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    .bar-fill, .cap-fill { transition: none !important; }
  }

  h1, h2, .serif {
    font-family: "DM Serif Display", Georgia, serif;
    font-weight: 400;
    color: var(--heading);
    text-wrap: balance;
    margin: 0;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold-deep);
    margin-bottom: 10px;
  }

  .hero { padding-top: 6vh; max-width: 640px; }
  .hero h1 { font-size: clamp(38px, 6.5vw, 56px); line-height: 1.08; }
  .hero .lede { font-size: 18px; color: var(--ink-soft); margin: 20px 0 6px; max-width: 54ch; }
  .hero-points { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 30px; }
  .chip {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
  }
  .promise {
    border-left: 3px solid var(--gold);
    padding: 4px 0 4px 18px;
    margin: 0 0 32px;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 58ch;
  }
  .promise strong { color: var(--ink); }

  .btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    background: var(--btn-bg);
    color: var(--btn-ink);
    border: none;
    border-radius: 8px;
    padding: 14px 30px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }
  .btn:focus-visible, .opt:focus-visible, .link-btn:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }
  .link-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 10px 4px;
  }
  .link-btn:hover { color: var(--ink); }
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; }

  .progress { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .progress-count {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }

  .q-head h2 { font-size: clamp(24px, 4vw, 31px); line-height: 1.2; }
  .scenario {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 22px;
    margin: 18px 0 6px;
    color: var(--ink-soft);
    font-size: 15.5px;
    box-shadow: var(--shadow);
  }
  .scenario p { margin: 0 0 8px; }
  .scenario p:last-child { margin-bottom: 0; }
  .ask { font-weight: 700; color: var(--ink); font-size: 16.5px; margin: 18px 0 6px; max-width: 60ch; }
  .pick-note { font-size: 13px; color: var(--gold-deep); font-weight: 700; margin: 0 0 14px; }
  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .opt {
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    text-align: left;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--surface);
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    width: 100%;
  }
  .opt:hover { border-color: var(--line-strong); }
  .opt.selected { border-color: var(--gold); background: var(--gold-tint); }
  .opt-key {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    color: var(--ink-faint);
    font-size: 12.5px;
    font-weight: 700;
    display: grid;
    place-items: center;
    margin-top: 1px;
  }
  .opt.multi .opt-key { border-radius: 6px; }
  .opt.selected .opt-key { background: var(--gold); border-color: var(--gold); color: #1d1503; }
  .opt.honest { border-style: dashed; color: var(--ink-soft); }
  .opt-divider {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
    margin: 6px 0 -2px;
  }

  .careers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  @media (max-width: 560px) { .careers { grid-template-columns: 1fr; } }
  .careers .opt { align-items: center; font-weight: 600; }

  .report-head { margin: 3vh 0 26px; }
  .report-head h1 { font-size: clamp(32px, 5.5vw, 44px); line-height: 1.1; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 26px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 24px; margin-bottom: 6px; }
  .card .sub { color: var(--ink-faint); font-size: 14px; margin: 0 0 16px; }
  .headline-card { border-top: 4px solid var(--gold); }
  .headline-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 14px; }
  @media (max-width: 620px) { .headline-grid { grid-template-columns: 1fr; } }
  .headline-grid .k {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .headline-grid .v { font-size: 17px; font-weight: 700; color: var(--heading); }
  .gap-profile {
    margin-top: 20px;
    padding: 16px 18px;
    background: var(--surface2);
    border-radius: 10px;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .gap-profile strong { color: var(--ink); }
  .diagnosis { margin-top: 14px; font-size: 15px; color: var(--ink); line-height: 1.65; }
  .insight {
    margin-top: 14px;
    font-size: 14px;
    color: var(--ink-soft);
    border-left: 3px solid var(--gold);
    padding-left: 14px;
  }

  .finding { padding: 14px 0; border-top: 1px solid var(--line); }
  .finding:first-of-type { border-top: none; padding-top: 4px; }
  .finding h3 { font-size: 16px; margin: 0 0 2px; color: var(--ink); }
  .finding .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 3px 10px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .tag.strong-t { background: var(--good-bg); color: var(--good); }
  .tag.gap-t { background: var(--bad-bg); color: var(--bad); }
  .mini { margin-top: 8px; }
  .mini-k {
    display: block;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold-deep);
    margin-bottom: 2px;
  }
  .mini p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .mini ul { margin: 0; padding-left: 20px; color: var(--ink-soft); font-size: 14.5px; }
  .mini li { margin-bottom: 3px; }

  .cap-row {
    display: grid;
    grid-template-columns: minmax(160px, 220px) 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .cap-row:first-of-type { border-top: none; }
  @media (max-width: 560px) {
    .cap-row { grid-template-columns: 1fr auto; }
    .cap-track { grid-column: 1 / -1; }
  }
  .cap-name { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .cap-track { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
  .cap-fill { height: 100%; border-radius: 4px; width: 0; transition: width 0.8s ease; }
  .cap-chip {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
  }
  .cap-chip.c-strong { background: var(--good-bg); color: var(--good); }
  .cap-chip.c-dev { background: var(--mid-bg); color: var(--mid); }
  .cap-chip.c-gap { background: var(--bad-bg); color: var(--bad); }
  .cap-fill.c-strong { background: var(--good); }
  .cap-fill.c-dev { background: var(--mid); }
  .cap-fill.c-gap { background: var(--bad); }
  .bottleneck {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--gold-tint);
    border-radius: 10px;
    font-size: 15px;
    color: var(--ink);
  }
  .bottleneck .mini-k { margin-bottom: 4px; }

  .role-level {
    display: inline-block;
    background: var(--gold-tint);
    color: var(--gold-deep);
    font-weight: 700;
    font-size: 14px;
    border-radius: 999px;
    padding: 6px 16px;
    margin: 6px 0 10px;
  }

  .fit-item { display: flex; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .fit-item:first-of-type { border-top: none; padding-top: 4px; }
  .fit-num {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface2);
    color: var(--heading);
    font-weight: 800;
    font-size: 14px;
    display: grid;
    place-items: center;
    margin-top: 2px;
  }
  .fit-item h3 { font-size: 16px; margin: 0 0 3px; color: var(--ink); }
  .fit-item p { margin: 0; color: var(--ink-soft); font-size: 15px; }

  .help-block { padding: 16px 0; border-top: 1px solid var(--line); }
  .help-block:first-of-type { border-top: none; padding-top: 4px; }
  .help-block h3 { font-size: 16px; margin: 0 0 6px; color: var(--ink); }
  .ssei-line {
    font-size: 14px;
    color: var(--ink);
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 10px 0 0;
  }
  .ssei-line strong { color: var(--gold-deep); }

  .step { display: flex; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .step:first-of-type { border-top: none; padding-top: 4px; }
  .step-num {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--navy);
    color: #ffffff;
    font-weight: 800;
    font-size: 13px;
    display: grid;
    place-items: center;
    margin-top: 2px;
  }
  :root[data-theme="dark"] .step-num { background: var(--navy-soft); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .step-num { background: var(--navy-soft); }
  }
  .step h3 { font-size: 16px; margin: 0 0 3px; color: var(--ink); }
  .step h3 em { font-style: normal; color: var(--gold-deep); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 8px; }
  .step p { margin: 0; color: var(--ink-soft); font-size: 15px; }

  .disclaimer { font-size: 13px; color: var(--ink-faint); max-width: 62ch; margin: 26px 0 14px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark">SSEI<span>.</span></div>
  <div class="topbar-label">Finance Skills Gap Assessment</div>
</div>
<main class="stage" id="stage" aria-live="polite"></main>

<script>
"use strict";

/* ============================================================
   ROLE-BASED FINANCE SKILLS GAP ASSESSMENT (v2)
   Option schema: t = text, q = quality tier 0..4, g = behaviour tags,
                  s = execution-gap flag, c = confidence level, v = value override
   Question schema: e = eyebrow, sc = scenario, ask, d = dimension weights,
                  m = multi-pick count, hl = honest option last, nsh = no shuffle,
                  alt = adaptive variant (used when earlier answers show acceptance)
   ============================================================ */

var TIERV = [8, 25, 48, 72, 95];

var DIM_NAMES = {
  fsi: "Financial Statement Interpretation",
  bcu: "Business and Commercial Understanding",
  vit: "Valuation and Investment Thinking",
  fme: "Financial Modelling and Forecasting",
  mri: "Market and Risk Interpretation",
  aj:  "Analytical Judgement"
};

var CAP_NAMES = {
  fsi: "Interpret Financial Statements",
  bcu: "Analyse a Business",
  fme: "Build Financial Forecasts",
  vit: "Understand Valuation",
  mri: "Interpret Markets and Risk",
  aj:  "Defend a Finance View"
};

var CAREERS = [
  { key: "ib",      label: "Investment Banking / Valuation" },
  { key: "er",      label: "Equity Research / Investment Analysis" },
  { key: "fpa",     label: "FP&A / Business Finance" },
  { key: "risk",    label: "Risk Management / Credit / Treasury" },
  { key: "acct",    label: "Accounting / Audit / Financial Reporting" },
  { key: "corpfin", label: "Corporate Finance" },
  { key: "am",      label: "Asset / Portfolio Management" },
  { key: "ns",      label: "Not Sure Yet" }
];

var ROLE_W = {
  ib:      { fsi: 0.22, fme: 0.25, vit: 0.25, aj: 0.16, bcu: 0.06, mri: 0.06 },
  er:      { fsi: 0.20, bcu: 0.20, vit: 0.22, aj: 0.20, mri: 0.10, fme: 0.08 },
  fpa:     { bcu: 0.25, fme: 0.25, fsi: 0.20, aj: 0.18, mri: 0.06, vit: 0.06 },
  risk:    { mri: 0.30, fsi: 0.24, aj: 0.20, bcu: 0.10, fme: 0.10, vit: 0.06 },
  acct:    { fsi: 0.34, aj: 0.28, bcu: 0.14, fme: 0.10, mri: 0.08, vit: 0.06 },
  corpfin: { vit: 0.24, fsi: 0.20, bcu: 0.20, aj: 0.16, mri: 0.12, fme: 0.08 },
  am:      { vit: 0.24, mri: 0.20, aj: 0.20, bcu: 0.18, fsi: 0.12, fme: 0.06 },
  ns:      { fsi: 1/6, bcu: 1/6, vit: 1/6, fme: 1/6, mri: 1/6, aj: 1/6 }
};

/* ================= QUESTION TRACKS ================= */

var TRACKS = {

/* ---------- INVESTMENT BANKING / VALUATION ---------- */
ib: { q: [
  { e: "Earnings quality", d: { fsi: 1, aj: 0.5 },
    sc: "You are valuing a company off its EBITDA. EBITDA has grown 25% a year for three years, but operating cash flow has weakened each year.",
    ask: "Before relying on those earnings, what would you investigate?",
    options: [
      { t: "Whether reported EBITDA actually converts into cash: receivables, inventory, one-off gains and anything flattering the number.", q: 4, g: ["t_invest","n_cash","n_wc","n_quality"] },
      { t: "How the EBITDA margin compares with listed peers, to confirm the growth is competitive rather than company-specific.", q: 2, g: ["t_metric"] },
      { t: "Not much. The valuation is built on EBITDA, so the timing of cash flows matters far less than the earnings trend.", q: 1, g: ["t_accept","t_surface"] },
      { t: "Whether the growth is organic or came from acquisitions made during the period.", q: 3, g: ["t_invest","n_quality"] }
    ] },
  { e: "Revenue forecasting", d: { fme: 1, bcu: 0.5 },
    sc: "Management expects revenue to grow 30% a year for the next three years and wants your model to reflect it.",
    ask: "What evidence should actually drive your revenue forecast?",
    options: [
      { t: "Capacity, the split of volume and price, market growth, the order pipeline and how accurate management's past forecasts were.", q: 4, g: ["t_model","t_sceptic","n_drivers"] },
      { t: "The three-year historical growth rate. It is the most objective number available and avoids arguments about assumptions.", q: 1, g: ["t_mech"] },
      { t: "Use management's number as the base case and handle the uncertainty later in sensitivities.", q: 2, g: ["t_accept"] },
      { t: "Growth rates of comparable listed companies, applied to this business without checking its own capacity.", q: 3, g: ["t_invest"] }
    ] },
  { e: "Margin assumptions", d: { fme: 1, bcu: 0.5 },
    sc: "Your model needs an operating margin assumption. Management is guiding to significant margin expansion.",
    ask: "What would justify building that expansion into your forecast?",
    options: [
      { t: "Identifying exactly where it comes from: pricing, product mix, operating leverage, input costs or higher utilisation.", q: 4, g: ["t_model","n_margin","n_drivers"] },
      { t: "Use the guided margin but apply a haircut of a few points as a margin of safety.", q: 2, g: ["t_accept"] },
      { t: "Hold last year's margin flat through the forecast. It is the safest assumption and nobody can challenge it.", q: 1, g: ["t_mech"] },
      { t: "Check the sector leader's margin as a ceiling for how far expansion could plausibly run.", q: 3, g: ["t_invest","n_margin"] }
    ] },
  { e: "Valuation judgement", d: { vit: 1, aj: 0.5 },
    sc: "You must value two companies: a mature, steady cash generator, and a young, fast-growing business that is still loss-making.",
    ask: "Should both be valued using the same approach?",
    options: [
      { t: "No. Method and assumptions should fit each one's maturity, cash profile and risk; multiples suit one, longer-horizon scenarios the other.", q: 4, g: ["t_invest","n_valuation"] },
      { t: "Yes. Applying one consistent multiple to both is the only way to keep the comparison fair.", q: 1, g: ["t_mech"] },
      { t: "Value both purely on a DCF, because a DCF is always the most rigorous method available.", q: 2, g: ["t_mech","n_valuation"] },
      { t: "Use different multiples for each (earnings for one, sales for the other) but treat risk and time horizon identically.", q: 3, g: ["t_metric"] }
    ] },
  { e: "Enterprise value thinking", d: { vit: 1, fsi: 0.5 },

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function levelFor(score, table) {
  for (var i = 0; i < table.length; i++) if (score >= table[i].min) return table[i].label;
  return table[table.length - 1].label;
}
function careerLabel(k) {
  for (var i = 0; i < CAREERS.length; i++) if (CAREERS[i].key === k) return CAREERS[i].label;
  return "";
}

/* Decide the adaptive Q7 variant from answers to Q1-Q6: repeated acceptance

function resolveQ7() {
  if (state.q7mode) return;

}

        state.career = k;
        state.answers = {};
        state.shuffles = {};
        state.q7mode = null;
      }
      var all = stage.querySelectorAll("[data-career]");
      for (var x = 0; x < all.length; x++) all[x].classList.remove("selected");
      this.classList.add("selected");
      document.getElementById("next").disabled = false;
    };
  }
  document.getElementById("back").onclick = renderIntro;
  document.getElementById("next").onclick = function () {
    if (state.career) renderQuestion(0);
  };
}

function orderFor(qi, q) {
  var key = qi + (state.q7mode === "alt" && qi === 6 ? "a" : "");
  if (state.shuffles[key]) return state.shuffles[key];
  var idx = [], last = null;
  for (var i = 0; i < q.options.length; i++) {
    if (q.hl && q.options[i].s) last = i; else idx.push(i);
  }
  var order = q.nsh ? idx : shuffle(idx);
  if (last !== null) order.push(last);
  state.shuffles[key] = order;
  return order;
}

function answerComplete(qi, q) {
  var a = state.answers[qi];
  if (a === undefined) return false;
  if (q.m) return a.length === q.m;
  return true;
}

function renderQuestion(qi) {
  if (qi === 6) resolveQ7();
  var q = getQ(qi);
  var order = orderFor(qi, q);
  var keys = "ABCDE";
  var pct = Math.round((qi / 9) * 100);

  var html =
    "<div class='progress'><span class='progress-count'>Question " + (qi + 1) + " of 9</span><div class='bar'><div class='bar-fill' style='width:" + pct + "%'></div></div></div>" +
    "<div class='q-head'><div class='eyebrow'>" + esc(q.e) + "</div></div>" +
    "<div class='scenario'><p>" + esc(q.sc) + "</p></div>" +
    "<p class='ask'>" + esc(q.ask) + "</p>" +
    (q.m ? "<p class='pick-note'>Pick exactly " + q.m + " · <span id='pickcount'>0</span> of " + q.m + " selected</p>" : "") +
    "<div class='opts'>";

  for (var i = 0; i < order.length; i++) {
    var oi = order[i];
    var opt = q.options[oi];
    var a = state.answers[qi];
    var isSel = q.m ? (a && a.indexOf(oi) !== -1) : a === oi;
    if (q.hl && opt.s) html += "<div class='opt-divider'>Or, honestly</div>";
    html += "<button class='opt" + (isSel ? " selected" : "") + (opt.s ? " honest" : "") + (q.m ? " multi" : "") + "' data-oi='" + oi + "'>" +
      "<span class='opt-key'>" + keys[i] + "</span><span>" + esc(opt.t) + "</span></button>";
  }

  html += "</div><div class='nav-row'><button class='link-btn' id='back'>← Back</button>" +
    "<button class='btn' id='next' " + (answerComplete(qi, q) ? "" : "disabled") + ">" +
    (qi === 8 ? "See my results" : "Continue") + "</button></div>";
  setScreen(html);

  function refresh() {
    var a = state.answers[qi];
    var all = stage.querySelectorAll("[data-oi]");
    for (var x = 0; x < all.length; x++) {
      var oid = parseInt(all[x].getAttribute("data-oi"), 10);
      var sel = q.m ? (a && a.indexOf(oid) !== -1) : a === oid;
      all[x].classList.toggle("selected", !!sel);
    }
    if (q.m) {
      var pc = document.getElementById("pickcount");
      if (pc) pc.textContent = a ? a.length : 0;
    }
    document.getElementById("next").disabled = !answerComplete(qi, q);
  }

  var btns = stage.querySelectorAll("[data-oi]");
  for (var b = 0; b < btns.length; b++) {
    btns[b].onclick = function () {
      var oi = parseInt(this.getAttribute("data-oi"), 10);
      if (q.m) {
        var a = state.answers[qi] || [];
        var at = a.indexOf(oi);
        if (at !== -1) a.splice(at, 1);
        else if (a.length < q.m) a.push(oi);
        state.answers[qi] = a;
      } else {
        state.answers[qi] = oi;
      }
      refresh();
    };
  }
  if (q.m) refresh();
  document.getElementById("back").onclick = function () {
    if (qi === 0) renderCareer(); else renderQuestion(qi - 1);
  };
  document.getElementById("next").onclick = function () {
    if (!answerComplete(qi, q)) return;
    if (qi === 8) renderResults(); else renderQuestion(qi + 1);
  };
}

/* ================= SCORING & DIAGNOSTICS ================= */

function computeResults() {
  var totals = {}, wsum = {}, tags = {};
  var struggle = false, confidence = null, prefRoles = null;
  var q7Result = null;

  for (var qi = 0; qi < 9; qi++) {
    var q = getQ(qi);
    var a = state.answers[qi];
    if (a === undefined) continue;
    var picks = q.m ? a : [a];
    var val = 0;
    for (var p = 0; p < picks.length; p++) {
      var o = q.options[picks[p]];
      val += optValue(o);
      if (o.s) struggle = true;
      if (o.c) confidence = o.c;
      if (o.r) prefRoles = o.r;
      var g = o.g || [];
      for (var t = 0; t < g.length; t++) tags[g[t]] = (tags[g[t]] || 0) + 1;
      if (qi === 6 && state.q7mode === "alt") q7Result = optValue(o);
    }
    val = val / picks.length;
    for (var d in q.d) {
      totals[d] = (totals[d] || 0) + val * q.d[d];
      wsum[d] = (wsum[d] || 0) + q.d[d];
    }
  }

  /* A dimension the chosen track barely touched inherits the measured mean,
     is excluded from strength/gap findings, and never becomes a fabricated verdict. */
  var dims = {}, unmeasured = [], mSum = 0, mCount = 0;
  for (var k in DIM_NAMES) {
    if (wsum[k]) {
      dims[k] = Math.round(totals[k] / wsum[k]);
      mSum += dims[k]; mCount++;
    } else {
      unmeasured.push(k);
    }
  }
  var mMean = mCount ? Math.round(mSum / mCount) : 45;
  for (var u = 0; u < unmeasured.length; u++) dims[unmeasured[u]] = mMean;
  var overall = 0, minDim = 100;
  for (var k2 in dims) {
    overall += dims[k2];
    if (dims[k2] < minDim) minDim = dims[k2];
  }
  overall = Math.round(overall / 6);

  var interp = (dims.fsi + dims.bcu + dims.vit) / 3;
  var exec = (dims.fme + dims.aj) / 2;

  var profile;
  if (struggle && interp >= 45) profile = "theory";
  else if (overall >= 85 && minDim >= 72) profile = "strong";
  else if (overall >= 70) profile = "ready";
  else if (interp >= 55 && exec < 52) profile = "theory";
  else profile = "building";

  /* behaviour patterns, evidence-gated */
  var T = function (x) { return tags[x] || 0; };
  var patterns = [];
  if (T("t_sceptic") >= 2 && T("t_accept") <= 1) patterns.push("sceptic");
  if (T("t_invest") >= 3) patterns.push("investigator");
  if (T("t_commercial") >= 2) patterns.push("commercial");
  if (T("t_model") >= 2) patterns.push("modeler");
  if (T("t_risk") >= 3) patterns.push("marketAware");
  if (T("t_decision") >= 2) patterns.push("decisive");
  if (T("t_surface") + T("t_accept") >= 4) patterns.push("surface");
  if (T("t_metric") >= 3) patterns.push("ratioFirst");
  /* only diagnose hesitancy if this track actually offered decision-format choices */
  var decisionOffered = 0;
  for (var dq = 0; dq < 9; dq++) {
    var qq = getQ(dq);
    for (var doi = 0; doi < qq.options.length; doi++) {
      if ((qq.options[doi].g || []).indexOf("t_decision") !== -1) { decisionOffered++; break; }
    }
  }
  if (decisionOffered >= 2 && T("t_invest") >= 3 && T("t_decision") === 0) patterns.push("hesitantDecider");
  if (struggle || (interp >= 55 && exec < 50)) patterns.push("execGap");

  var noticed = [];
  for (var n in NOTICE_PHRASES) if (T(n) >= 1) noticed.push({ k: n, c: T(n) });
  noticed.sort(function (x, y) { return y.c - x.c; });

  var sorted = Object.keys(dims).filter(function (d) { return unmeasured.indexOf(d) === -1; })
    .sort(function (x, y) { return dims[y] - dims[x]; });
  var strengths = sorted.slice(0, 2);
  var gaps = sorted.slice().reverse().filter(function (d) { return dims[d] < 65; }).slice(0, 3);
  var softGaps = false;
  if (gaps.length === 0) { gaps = [sorted[sorted.length - 1]]; softGaps = true; }

  var rw = ROLE_W[state.career];
  var roleScore = 0;
  for (var rd in rw) roleScore += rw[rd] * dims[rd];
  roleScore = Math.round(roleScore);

  var confGap = null;
  if (confidence !== null) {
    confGap = overall - ({ 4: 80, 3: 62, 2: 47, 1: 32 })[confidence];
  }

  /* Not-Sure career fit: role-weighted ability + stated preference */
  var fits = null;
  if (state.career === "ns") {
    fits = [];
    for (var rk in ROLE_W) {
      if (rk === "ns") continue;
      var f = 0;
      for (var fd in ROLE_W[rk]) f += ROLE_W[rk][fd] * dims[fd];
      if (prefRoles && prefRoles.indexOf(rk) !== -1) f += 8;
      fits.push({ role: rk, score: Math.round(f), pref: prefRoles ? prefRoles.indexOf(rk) !== -1 : false });
    }
    fits.sort(function (x, y) { return y.score - x.score; });
    fits = fits.slice(0, 3);
  }

  return {
    dims: dims, overall: overall, minDim: minDim, profile: profile,
    tags: tags, patterns: patterns, noticed: noticed,
    strengths: strengths, gaps: gaps, softGaps: softGaps,
    roleScore: roleScore, confidence: confidence, confGap: confGap,
    struggle: struggle, fits: fits,
    q7alt: state.q7mode === "alt", q7Result: q7Result
  };
}

/* Personalised 2-4 sentence diagnosis built from behaviour, not score. */
function buildDiagnosis(res, role) {
  var s = [];
  var P = function (p) { return res.patterns.indexOf(p) !== -1; };
  var np = res.noticed.slice(0, 2).map(function (n) { return NOTICE_PHRASES[n.k]; });

  if (P("sceptic")) s.push("You rarely accepted a management claim or a comfortable headline without asking what evidence would support it" + (np.length ? ", and you kept returning to " + np.join(" and ") : "") + ".");
  else if (P("investigator")) s.push("Across the scenarios you repeatedly went looking for what was missing" + (np.length ? ", most often " + np.join(" and ") : "") + ", before you were willing to conclude.");
  else if (P("commercial")) s.push("Your instinct was to look through the numbers to the business behind them: pricing, mix, costs and demand came up again and again in your choices.");
  else if (P("modeler")) s.push("When a forecast or scenario was needed, you naturally reached for drivers and assumptions rather than extending past numbers.");
  else if (P("decisive")) s.push("You consistently pushed analysis toward a decision rather than stopping at observation, which is rarer than it sounds.");
  else if (np.length) s.push("Your strongest instinct was noticing " + np.join(" and ") + " where many students stop at the headline number.");
  else s.push("Your answers showed a mix of instincts that has not yet settled into one consistent way of working through a finance situation.");

  if (P("surface")) s.push("The scenarios that pulled your profile down were the ones where a headline number or a confident narrative was available to accept, and you accepted it.");
  else if (P("execGap")) s.push("Your answers became less structured when insight had to be converted into a forecast, a decision or a piece of work delivered on a clock.");
  else if (P("ratioFirst")) s.push("You reach for ratios and benchmarks quickly, but the step behind them, what the business did to move the ratio, appeared less often in your answers.");
  else if (P("hesitantDecider")) s.push("You investigate well, but you tended to stop one step short of a recommendation, which is the step your target role is ultimately paid for.");
  else {
    var wk = res.gaps[0];
    if (!res.softGaps) s.push("The clearest development area was " + GAP_TITLES[wk].toLowerCase() + ", which showed up as the weakest thread across your answers.");
  }

  if (res.q7alt && res.q7Result !== null) {
    if (res.q7Result >= 70) s.push("When a later scenario quietly re-tested that acceptance habit, you corrected for it, which is a genuinely good sign.");
    else s.push("A later scenario quietly re-tested that habit, and the pattern held, so treat it as your first fix.");
  }

  var wk2 = res.gaps[0];
  var roleRef = state.career === "ns" ? "whichever role you eventually choose" : role;
  var whyLine = ROLE_WHY[state.career][wk2];
  /* lowercase the first letter only when it starts an ordinary word, not an acronym like FP&A */
  if (whyLine.length > 1 && whyLine.charAt(1) === whyLine.charAt(1).toLowerCase()) {
    whyLine = whyLine.charAt(0).toLowerCase() + whyLine.slice(1);
  }
  s.push("For " + roleRef + ", this matters because " + whyLine);

  return s.slice(0, 4).join(" ");
}

function buildBottleneck(res) {
  if (res.patterns.indexOf("execGap") !== -1)
    return "Your main gap is not recognising finance concepts. It is structuring those concepts into an independent analysis.";
  if (res.patterns.indexOf("surface") !== -1)
    return "Your main gap is the pause before concluding: investigating what sits underneath a headline number before accepting it.";
  if (res.patterns.indexOf("hesitantDecider") !== -1)
    return "Your main gap is the last step: converting good investigation into a recommendation you are willing to defend.";
  var wk = res.gaps[0];
  var lines = {
    fsi: "Your main bottleneck is statement fluency: connecting the P&L, balance sheet and cash flow into one picture, quickly.",
    bcu: "Your main bottleneck is the business lens: explaining what operationally caused the numbers you can already read.",
    vit: "Your main bottleneck is valuation context: judging what a price assumes rather than applying rules of thumb.",
    fme: "Your main bottleneck is conversion: turning what you notice into structured assumptions and a linked forecast.",
    mri: "Your main bottleneck is transmission: tracing macro and risk events all the way into a specific company's cash flows.",
    aj:  "Your main bottleneck is evidence discipline: testing claims before they enter your analysis."
  };
  return lines[wk];
}

function pickSteps(res) {
  var fixKey;
  if (res.patterns.indexOf("execGap") !== -1) fixKey = "exec";
  else if (res.patterns.indexOf("surface") !== -1 && res.dims.aj < 65) fixKey = "aj";
  else fixKey = res.gaps[0];
  var applyRole = state.career === "ns" ? (res.fits && res.fits[0] ? res.fits[0].role : "er") : state.career;
  return [
    { label: "Fix", title: FIX_LINES[fixKey] },
    { label: "Apply", title: ROLE_APPLY[applyRole] },
    { label: "Prove", title: ROLE_PROVE[applyRole] }
  ];
}

/* ================= RESULTS ================= */

function renderResults() {
  var res = computeResults();
  var prof = PROFILES[res.profile];
  var role = careerLabel(state.career);
  var isNS = state.career === "ns";
  var overallLevel = levelFor(res.overall, LEVELS);
  var roleLevel = levelFor(res.roleScore, ROLE_LEVELS);
  var whyRole = ROLE_WHY[state.career];

  var html = "<div class='report-head'><div class='eyebrow'>Finance Skills Gap Report</div><h1>Your Finance Readiness Profile</h1></div>";

  /* --- Headline --- */
  html += "<div class='card headline-card'>" +
    "<div class='headline-grid'>" +
      "<div><div class='k'>Overall Practical Readiness</div><div class='v'>" + overallLevel + "</div></div>" +
      "<div><div class='k'>Target Role</div><div class='v'>" + esc(role) + "</div></div>" +
      "<div><div class='k'>Practical Finance Gap</div><div class='v'>" + prof.name + "</div></div>" +
    "</div>" +
    "<div class='gap-profile'><strong>" + prof.name + ".</strong> " + prof.text + "</div>" +
    "<p class='diagnosis'>" + buildDiagnosis(res, role) + "</p>";

  if (res.confGap !== null) {
    var confNote;
    if (res.confGap <= -18) confNote = "Your self-rated confidence runs ahead of what your scenario answers demonstrated. That is common and fixable: practice on real companies will close the gap from both sides.";
    else if (res.confGap >= 18) confNote = "Your scenario answers were stronger than your self-rated confidence. You may be underrating yourself; structured practice should turn quiet ability into conviction.";
    else confNote = "Your self-assessment broadly matches what your answers demonstrated, which is itself a good analytical sign: you read your own ability accurately.";
    html += "<div class='insight'>" + confNote + "</div>";
  }
  html += "</div>";

  /* --- Strongest areas --- */
  html += "<div class='card'><h2>Your 2 Strongest Areas</h2><p class='sub'>Where your answers showed the most practical instinct</p>";
  for (var s = 0; s < res.strengths.length; s++) {
    var sd = res.strengths[s];
    var sTag = res.dims[sd] >= 60 ? levelFor(res.dims[sd], LEVELS) : "Relative Strength";
    var ev = STRENGTH_EVIDENCE[sd];
    var hasTag = false;
    for (var e = 0; e < ev.tag.length; e++) if (res.tags[ev.tag[e]]) hasTag = true;
    var evText = (hasTag && ev.yes) ? ev.yes : ev.no;
    html += "<div class='finding'><h3>" + DIM_NAMES[sd] + "<span class='tag strong-t'>" + sTag + "</span></h3>" +
      "<div class='mini'><span class='mini-k'>What your answers suggest</span><p>" + evText + "</p></div>" +
      "<div class='mini'><span class='mini-k'>Why this matters for " + (isNS ? "any finance role" : "your role") + "</span><p>" + whyRole[sd] + "</p></div>" +
    "</div>";
  }
  html += "</div>";

  /* --- Gaps --- */
  html += "<div class='card'><h2>Your Biggest Skill Gaps</h2><p class='sub'>" +
    (res.softGaps ? "No major gaps showed up. This is your relatively weakest area, worth sharpening next" : "Specific, fixable, and ranked by how much they are holding you back") + "</p>";
  for (var g = 0; g < res.gaps.length; g++) {
    var gd = res.gaps[g];
    var gTag = res.softGaps ? "Sharpen Next" : levelFor(res.dims[gd], LEVELS);
    var gn = GAP_NOTICED[gd];
    var gBody = res.softGaps
      ? "Nothing here is broken. Relative to your other capabilities, this is the area with the most headroom, and sharpening it is what takes you from strong generalist to specialist."
      : ((res.tags[gn.cond] || 0) >= 2 ? gn.yes : gn.no);
    html += "<div class='finding'><h3>" + GAP_TITLES[gd] + "<span class='tag gap-t'>" + gTag + "</span></h3>" +
      "<div class='mini'><span class='mini-k'>What we noticed</span><p>" + gBody + "</p></div>" +
      "<div class='mini'><span class='mini-k'>Why it matters for " + esc(isNS ? "whichever role you choose" : role) + "</span><p>" + whyRole[gd] + "</p></div>" +
      "<div class='mini'><span class='mini-k'>What would improve it</span><p>" + IMPROVE[gd] + "</p></div>" +
    "</div>";
  }
  html += "</div>";

  /* --- Capability dashboard --- */
  html += "<div class='card'><h2>Can You Actually Do It?</h2><p class='sub'>Your practical capability across the six things finance work is made of</p>";
  var capOrder = ["fsi", "bcu", "fme", "vit", "mri", "aj"];
  for (var c = 0; c < capOrder.length; c++) {
    var ck = capOrder[c];
    var v = res.dims[ck];
    var cls = v >= 70 ? "c-strong" : (v >= 45 ? "c-dev" : "c-gap");
    var lab = v >= 70 ? "Strong" : (v >= 45 ? "Developing" : "Gap");
    html += "<div class='cap-row'><span class='cap-name'>" + CAP_NAMES[ck] + "</span>" +
      "<div class='cap-track'><div class='cap-fill " + cls + "' data-w='" + v + "'></div></div>" +
      "<span class='cap-chip " + cls + "'>" + lab + "</span></div>";
  }
  html += "<div class='bottleneck'><span class='mini-k'>Your biggest practical bottleneck</span>" + buildBottleneck(res) + "</div></div>";

  /* --- Role readiness OR career-fit signals --- */
  if (isNS) {
    html += "<div class='card'><h2>Your Strongest Career-Fit Signals</h2><p class='sub'>From demonstrated ability plus the task you said felt most natural</p>";
    for (var f = 0; f < res.fits.length; f++) {
      var fit = res.fits[f];
      var topDims = Object.keys(ROLE_W[fit.role]).sort(function (a, b) { return ROLE_W[fit.role][b] - ROLE_W[fit.role][a]; }).slice(0, 2);
      var bestDim = res.dims[topDims[0]] >= res.dims[topDims[1]] ? topDims[0] : topDims[1];
      var reason = "Your " + DIM_NAMES[bestDim].toLowerCase() + " answers were among your strongest, and this work leans on exactly that." +
        (fit.pref ? " You also said this type of task felt most natural to you." : "");
      html += "<div class='fit-item'><div class='fit-num'>" + (f + 1) + "</div><div><h3>" + esc(careerLabel(fit.role)) + "</h3><p>" + reason + "</p></div></div>";
    }
    html += "<p style='color:var(--ink-faint); font-size:13px; margin:14px 0 0'>This is a directional signal based on this assessment, not a definitive career recommendation.</p></div>";
  } else {
    var rdims = Object.keys(ROLE_W[state.career]).sort(function (a, b) { return ROLE_W[state.career][b] - ROLE_W[state.career][a]; });
    var readyDims = rdims.filter(function (d) { return res.dims[d] >= 60; }).slice(0, 2);
    var holdDim = rdims.slice(0, 4).sort(function (a, b) { return res.dims[a] - res.dims[b]; })[0];
    html += "<div class='card'><h2>Your Current Readiness for " + esc(role) + "</h2>" +
      "<div class='role-level'>" + roleLevel + "</div>";
    html += "<div class='mini'><span class='mini-k'>What you already appear ready for</span>";
    if (readyDims.length) {
      html += "<ul>";
      for (var rr = 0; rr < readyDims.length; rr++) html += "<li>" + CAP_READY[readyDims[rr]] + "</li>";
      html += "</ul>";
    } else {
      html += "<p>Your foundations are still forming; nothing yet stands out as role-ready, and that is exactly what this stage is for.</p>";
    }
    html += "</div>";
    html += "<div class='mini'><span class='mini-k'>What would currently hold you back</span><p>" + GAP_TITLES[holdDim] + " is the weakest of the capabilities this role leans on most. " + whyRole[holdDim] + "</p></div>";
    html += "<div class='mini'><span class='mini-k'>Before you are more interview-ready</span><ul>";
    var skl = ROLE_SKILLS[state.career];
    for (var sk = 0; sk < Math.min(3, skl.length); sk++) html += "<li>" + skl[sk] + "</li>";
    html += "</ul></div>";
    html += "<p style='color:var(--ink-faint); font-size:13px; margin:14px 0 0'>Readiness reflects your answers today. It maps what to build next; it does not predict hiring outcomes or guarantee interview success.</p></div>";
  }

  /* --- Recommendations --- */
  var helpKeys = [];
  if (res.patterns.indexOf("execGap") !== -1) helpKeys.push("exec");
  for (var h = 0; h < res.gaps.length; h++) {
    if (helpKeys.length >= 3) break;
    if (helpKeys.indexOf(res.gaps[h]) === -1 && HELP_BLOCKS[res.gaps[h]]) helpKeys.push(res.gaps[h]);
  }
  if (helpKeys.length === 0) helpKeys.push("exec");
  html += "<div class='card'><h2>How to Close These Gaps</h2><p class='sub'>Built from your diagnosed gaps, not a standard pitch</p>";
  for (var hb = 0; hb < helpKeys.length; hb++) {
    var hk = helpKeys[hb];
    var blk = HELP_BLOCKS[hk];
    var diag = hk === "exec"
      ? "The concepts are largely in place; structuring them into finished, defensible work is the missing layer."
      : ((res.tags[GAP_NOTICED[hk].cond] || 0) >= 2 ? GAP_NOTICED[hk].yes : GAP_NOTICED[hk].no);
    var why = hk === "exec"
      ? "Every finance role, including " + (isNS ? "the ones suggested above" : role) + ", is ultimately assessed on delivered analysis, not recognised concepts."
      : whyRole[hk];
    html += "<div class='help-block'><h3>" + blk.title + "</h3>" +
      "<div class='mini'><span class='mini-k'>The gap</span><p>" + diag + "</p></div>" +
      "<div class='mini'><span class='mini-k'>Why it matters</span><p>" + why + "</p></div>" +
      "<div class='mini'><span class='mini-k'>What to practise</span><ul>";
    for (var it = 0; it < blk.practise.length; it++) html += "<li>" + blk.practise[it] + "</li>";
    html += "</ul></div>" +
      "<div class='mini'><span class='mini-k'>How to practise it</span><p>" + blk.how + "</p></div>" +
      "<p class='ssei-line'><strong>Where SSEI fits:</strong> " + blk.ssei + "</p></div>";
  }
  html += "</div>";

  /* --- Next 3 steps --- */
  var steps = pickSteps(res);
  html += "<div class='card'><h2>Your Next 3 Steps</h2><p class='sub'>Fix the gap, apply it on something real, produce proof</p>";
  for (var st = 0; st < steps.length; st++) {
    html += "<div class='step'><div class='step-num'>" + (st + 1) + "</div><div><h3><em>" + steps[st].label + "</em></h3><p>" + steps[st].title + "</p></div></div>";
  }
  html += "</div>";

  html += "<p class='disclaimer'>This is a directional diagnostic based on nine role-specific scenarios. It shows how you approached realistic finance situations today and what to build next. It does not predict interview or job outcomes, and it is not a substitute for doing the work.</p>" +
    "<button class='link-btn' id='retake' style='padding-left:0'>Retake the assessment →</button>";

  setScreen(html);

  var fills = stage.querySelectorAll(".cap-fill");
  setTimeout(function () {
    for (var fl = 0; fl < fills.length; fl++) fills[fl].style.width = fills[fl].getAttribute("data-w") + "%";
  }, 60);

  document.getElementById("retake").onclick = function () {
    state = { career: null, answers: {}, shuffles: {}, q7mode: null };
    renderIntro();
  };
}

renderIntro();
</script>

</body>
</html>
